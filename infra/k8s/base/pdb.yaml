apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fieldrepo-api
  labels:
    app.kubernetes.io/name: fieldrepo
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldrepo
      app.kubernetes.io/component: api
---
