apiVersion: v1
kind: ConfigMap
metadata:
  name: fieldrepo-config
  labels:
    app.kubernetes.io/name: fieldrepo
data:

  DATABASE_CONNECTION_LIMIT: "10"
  DATABASE_USE_TRANSACTION_POOLER: "true"
  DATABASE_REQUIRE_SSL: "true"

  MEDIA_QUEUE_WORKER_ENABLED: "false"

  BACKEND_EXPOSE_DOCS: "false"
  SECURITY_HSTS_ENABLED: "true"
  SECURITY_FORCE_HSTS: "false"

  ALLOW_REMOTE_DATABASE: "yes-i-mean-it"

  FIELDREPO_ENV: "REPLACE_IN_OVERLAY"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "REPLACE_IN_OVERLAY"
  BACKEND_CORS_ORIGINS: "REPLACE_IN_OVERLAY"
  NEXT_PUBLIC_APP_URL: "REPLACE_IN_OVERLAY"
  MASTER_ADMIN_EMAIL: "REPLACE_IN_OVERLAY"
