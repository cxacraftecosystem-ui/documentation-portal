apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fieldrepo-secrets
  labels:
    app.kubernetes.io/name: fieldrepo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fieldrepo-aws-secrets
    kind: SecretStore
  target:
    name: fieldrepo-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: fieldrepo/ENVIRONMENT/DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: fieldrepo/ENVIRONMENT/JWT_SECRET
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/AWS_SECRET_ACCESS_KEY

    - secretKey: SECRETS_ENCRYPTION_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/SECRETS_ENCRYPTION_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_ANDROID_CLIENT_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GOOGLE_ANDROID_CLIENT_ID

    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/ELEVENLABS_API_KEY
    - secretKey: DEEPGRAM_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/DEEPGRAM_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/OPENAI_API_KEY
    - secretKey: GEMINI_API_KEYS
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GEMINI_API_KEYS
