# ---------------------------------------------------------------------------------------------
# SECRETS: TEMPLATE ONLY. There is not, and must never be, a Secret manifest in this repository
# holding real values.
#
# A core/v1 Secret is base64, not encryption — committing one publishes it, and `git rm` does not
# unpublish it. So the cluster gets its values from AWS Secrets Manager, pulled in by the External
# Secrets Operator (ESO), and what lives here is a description of WHICH keys to fetch.
#
# Why AWS Secrets Manager rather than SOPS, Sealed Secrets or Vault: the deployment is already on
# AWS (S3 for media, IAM for the media user, EC2 today), so Secrets Manager needs no new vendor, no
# new key-distribution story, and it can be reached with IRSA — the pod assumes a role, and there is
# no bootstrap credential sitting in the cluster to leak. The same argument would favour Vault if
# this project already ran one. It does not.
#
# Prerequisites, once per cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# and an IAM role trusted by the cluster's OIDC provider with secretsmanager:GetSecretValue on
# arn:aws:secretsmanager:<region>:<account>:secret:fieldrepo/<env>/*
#
# The source of truth for the VALUES is the same one the EC2 deploy uses today: the BACKEND_ENV
# GitHub secret. Migrating is a copy of that file into one Secrets Manager entry per key below.
# ---------------------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fieldrepo-secrets
  labels:
    app.kubernetes.io/name: fieldrepo
spec:
  # Re-read hourly so a rotation reaches the cluster on its own. Note that a refreshed Secret does
  # NOT restart the pods that mounted it via envFrom — environment variables are read once at
  # process start. After rotating anything below, roll the Deployments:
  #   kubectl rollout restart deployment/fieldrepo-api deployment/fieldrepo-queue
  refreshInterval: 1h
  secretStoreRef:
    # Defined per cluster, not per app. Overlays point at their environment's store; see
    # overlays/*/secretstore.yaml for the shape.
    name: fieldrepo-aws-secrets
    kind: SecretStore
  target:
    # The name deployment-api.yaml and deployment-queue.yaml reference in envFrom.
    name: fieldrepo-secrets
    creationPolicy: Owner
  data:
    # --- Required: the app refuses to start without these (backend/app/core/config.py) -----------
    # The SESSION-pooler / direct URL, exactly as on EC2. app/core/db.py rewrites it to the
    # transaction pooler (:6543) for the runtime client itself; storing the :6543 form here would
    # break migrations, which read DATABASE_URL raw and must not run through pgbouncer.
    - secretKey: DATABASE_URL
      remoteRef:
        key: fieldrepo/ENVIRONMENT/DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: fieldrepo/ENVIRONMENT/JWT_SECRET
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/AWS_SECRET_ACCESS_KEY

    # --- Optional, but set them before you need them ---------------------------------------------
    # Encrypts the runtime-editable provider keys in ManagedSecret. When unset it is DERIVED from
    # JWT_SECRET, which means rotating JWT_SECRET without having set this first makes every stored
    # provider key undecryptable and each one has to be re-entered by hand in the Settings hub.
    # Set it explicitly now so that rotation is survivable later.
    - secretKey: SECRETS_ENCRYPTION_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/SECRETS_ENCRYPTION_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_ANDROID_CLIENT_ID
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GOOGLE_ANDROID_CLIENT_ID

    # --- Speech-to-text provider chain (ElevenLabs -> Deepgram -> Whisper) ------------------------
    # Consumed by the queue pod. Absent keys degrade the chain rather than breaking boot, so an
    # environment that does no transcription can drop these four entries entirely.
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/ELEVENLABS_API_KEY
    - secretKey: DEEPGRAM_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/DEEPGRAM_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: fieldrepo/ENVIRONMENT/OPENAI_API_KEY
    - secretKey: GEMINI_API_KEYS
      remoteRef:
        key: fieldrepo/ENVIRONMENT/GEMINI_API_KEYS
