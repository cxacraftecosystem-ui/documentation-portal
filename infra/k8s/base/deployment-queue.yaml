apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldrepo-queue
  labels:
    app.kubernetes.io/name: fieldrepo
    app.kubernetes.io/component: queue
  annotations:
    fieldrepo.io/singleton: "This workload must never run more than one pod."
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldrepo
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldrepo
        app.kubernetes.io/component: queue
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: queue
          image: fieldrepo-api
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: fieldrepo-config
            - secretRef:
                name: fieldrepo-secrets
          env:
            - name: MEDIA_QUEUE_WORKER_ENABLED
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1536Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
