# See overlays/dev/secretstore.yaml for why this is namespaced rather than a ClusterSecretStore.
# This is the one whose IAM role can read the live database credentials, so it is the one whose
# trust policy and resource ARN are worth reading twice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldrepo-eso
  annotations:
    # secretsmanager:GetSecretValue on
    # arn:aws:secretsmanager:ap-south-1:<account>:secret:fieldrepo/prod/* — no wildcard above the
    # prod/ segment, or the separation the other two overlays are built around stops meaning
    # anything.
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fieldrepo-prod-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fieldrepo-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: fieldrepo-eso
