# The per-environment half of the secret wiring. base/externalsecret.yaml says WHICH keys to fetch;
# this says WHERE FROM and AS WHOM, and both answers differ per environment — which is the point of
# keeping it in the overlay. A single cluster-wide ClusterSecretStore would let a compromised dev
# pod read the production connection string, so each namespace gets a namespaced SecretStore bound
# to a role scoped to its own prefix in Secrets Manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldrepo-eso
  annotations:
    # IRSA. The External Secrets Operator exchanges this ServiceAccount's projected OIDC token for
    # AWS credentials, so nothing long-lived is stored in the cluster at all. Create the role with a
    # trust policy on the cluster's OIDC provider and an inline policy allowing
    # secretsmanager:GetSecretValue on arn:aws:secretsmanager:ap-south-1:<account>:secret:fieldrepo/dev/*
    # — and on nothing else. Scoping this ARN is the control that keeps dev out of prod's secrets.
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fieldrepo-dev-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  # The name base/externalsecret.yaml refers to in secretStoreRef.
  name: fieldrepo-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: fieldrepo-eso
