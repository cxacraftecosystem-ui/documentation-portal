apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldrepo-eso
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fieldrepo-staging-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fieldrepo-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: fieldrepo-eso
