# See overlays/dev/secretstore.yaml for why this is namespaced rather than a ClusterSecretStore.
# The only differences here are the role and the prefix it may read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldrepo-eso
  annotations:
    # Scope the inline policy to secretsmanager:GetSecretValue on
    # arn:aws:secretsmanager:ap-south-1:<account>:secret:fieldrepo/staging/* and nothing else.
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fieldrepo-staging-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fieldrepo-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: fieldrepo-eso
