<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
body{margin:0;background:#14121F}
a{color:#C090F5;text-decoration:none}a:hover{color:#D9BDFA}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121F; color: #F2F0F9; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px; border-bottom: 1px solid #2F2B45">
<span style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #C090F5"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font: 700 20px/28px 'Plus Jakarta Sans', system-ui, sans-serif; color: #F2F0F9">Meera Devi</span>
<span style="font-size: 13px; line-height: 16px; color: #9E98B2">Stone carving · Odia · today</span>
</span>
<span style="height: 48px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #C090F5">Review</span>
<span style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #D0CBDF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
</div>
<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #F2F0F9">18 of 108 questions</span>
<span style="height: 6px; border-radius: 3px; background: #2E2840; overflow: hidden; display: flex"><span style="width: 17%; height: 100%; background: #C090F5"></span></span>
</div>
<div style="padding: 12px 16px 0; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; min-height: 60px; border-bottom: 1px solid #2F2B45">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #2E2840; color: #F2F0F9; display: flex; align-items: center; justify-content: center; font: 700 16px 'Plus Jakarta Sans', sans-serif">{{r.code}}</span>
<span style="flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: #F2F0F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
</div>
</sc-for>
</div>
</div>

<a href="interview-Sections.dc.html" aria-label="Close" style="position: absolute; inset: 0; display: block; background: rgba(8,6,14,0.72)"></a>

<div role="dialog" aria-modal="true" aria-label="Session options" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 16px 24px; background: #1E1B2E; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #3A3350; margin-top: 4px"></div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 0">
<span id="record-by-label" style="font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .025em; color: #9E98B2">Record by</span>
<div role="radiogroup" aria-labelledby="record-by-label" style="display: flex; border: 1px solid #3A3350; border-radius: 10px; overflow: hidden">
<button role="radio" aria-checked="true" style="flex: 1; height: 48px; padding: 0 6px; border: 0; background: #C090F5; color: #2A0F47; font-size: 14px; font-weight: 600">Section</button>
<a href="interview-Question.dc.html" role="radio" aria-checked="false" style="flex: 1; height: 48px; padding: 0 6px; display: flex; align-items: center; justify-content: center; background: none; color: #F2F0F9; font-size: 14px; font-weight: 500">Question</a>
</div>
<span style="font-size: 13px; line-height: 18px; color: #9E98B2">Applies to this session</span>
</div>

<div aria-hidden="true" style="height: 1px; background: #2F2B45"></div>

<ul role="menu" aria-label="Session" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F2F0F9; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0CBDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>Edit details</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F2F0F9; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0CBDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"></circle><path d="M3 20a7 7 0 0114 0"></path><path d="M19 8v6M16 11h6"></path></svg>Add researcher</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F2F0F9; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0CBDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 20v-2M20 14v2"></path></svg>Join code and QR</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F2F0F9; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0CBDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Read view</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F2F0F9; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0CBDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Continue another day</button></li>
</ul>

<div aria-hidden="true" style="height: 1px; background: #2F2B45"></div>

<ul role="menu" aria-label="Remove or merge" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F87171; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"></circle><path d="M3 20a7 7 0 0114 0"></path><path d="M16 11h6"></path></svg>Remove artisan</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F87171; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v5a6 6 0 006 6h6"></path><path d="M6 20v-3"></path><path d="M15 12l3 3-3 3"></path></svg>Merge into another session</button></li>
<li role="none"><button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 4px; border: 0; background: none; color: #F87171; font-size: 16px; text-align: left"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete session</button></li>
</ul>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var rows = [
{ code: 'A', title: 'Origin, history, place and personal journey' },
{ code: 'B', title: 'Family, community, gender and knowledge transfer' },
{ code: 'C', title: 'Migration, mobility and changing livelihoods' },
{ code: 'D', title: 'Raw materials, procurement and resource security' }
];
return { rows: rows };
}
}
</script>
</body>
</html>
