name: Keep Supabase Active

on:
  schedule:
    # Run every day at 8:00 PM UTC (1:30 AM IST).
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The repository's one Node major, `engines.node` in frontend/package.json (24.x). This
          # job read "20" until 2026-10-09, five months after Node 20 reached end of life.
          node-version-file: frontend/package.json
          check-latest: true
          cache: "npm"

      - name: Install keep-alive dependencies
        run: npm ci

      - name: Ping Supabase Postgres
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run keep-alive

      - name: Notify on failure
        if: failure()
        run: |
          echo "Supabase keep-alive failed."
          echo "Check that SUPABASE_DATABASE_URL or DATABASE_URL is present in repository secrets."
