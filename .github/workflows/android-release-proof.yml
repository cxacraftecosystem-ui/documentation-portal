name: Android release-variant runtime proof (TEMPORARY)

# ─── TEMPORARY: ADDED BY THE ADVERSARIAL REVIEW OF upgrade/doc-android, AND DELETED BY THE NEXT COMMIT ───
#
# android-emulator.yml (byte-for-byte unchanged by this file) installs only the DEBUG apk; the release
# variant was built and read with aapt2 but never launched. This builds the release variant the way
# publish-android.yml builds it — that workflow's own steps, run verbatim by
# android/scripts/review-release-proof/run_publish_guards.py, as a push of the tag naming this tree's
# version would run them, with build-tools 37.0.0 — but signed with a THROWAWAY key generated below,
# never the release key (no secret is read anywhere in this file). It then installs that release APK on
# an emulator and drives it: sign-in against a stub on the runner (through `adb reverse`), the
# dashboard, the drawer, View Data with Coil loading an https:// and an http:// thumbnail checked in the
# screen's pixels, the full-screen viewer, a cold relaunch. Neither APK leaves the job: nothing is
# uploaded but screenshots, UI dumps, logcat and text.
#
# A push trigger because `workflow_dispatch` only fires for a file on the default branch.

on:
  push:
    branches: [upgrade/doc-android]
    paths:
      - ".github/workflows/android-release-proof.yml"
      - "android/**"

permissions:
  contents: read

concurrency:
  group: android-release-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Release APK (throwaway key) on API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        # 37.0 is the target; 34 is a common field handset; 26 is minSdk, the oldest device allowed in.
        api-level: ["37.0", "34", "26"]
    runs-on: ubuntu-26.04
    timeout-minutes: 80
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Make a throwaway signing key (never the release key)
        # Kept in files under $RUNNER_TEMP rather than GITHUB_ENV, so not even this throwaway key's
        # base64 is printed into a step header. Only the public certificate digest is shown.
        run: |
          set -euo pipefail
          umask 077
          dir="${RUNNER_TEMP}/rp-key"
          mkdir -p "$dir"
          RP_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${RP_PASS}"
          export RP_PASS
          keytool -genkeypair -storetype PKCS12 -keystore "$dir/throwaway.p12" -storepass:env RP_PASS \
            -alias throwaway-release-proof -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=Throwaway release-proof key - never distributed, O=Review, C=IN" 2>&1 | tail -n 2
          keytool -list -v -keystore "$dir/throwaway.p12" -storepass:env RP_PASS -alias throwaway-release-proof \
            | sed -n 's/^[[:space:]]*SHA256: *//p' > "$dir/cert-sha256"
          printf '%s' "$RP_PASS" > "$dir/password"
          printf '%s' "throwaway-release-proof" > "$dir/alias"
          base64 -w0 "$dir/throwaway.p12" > "$dir/keystore.b64"
          rm -f "$dir/throwaway.p12"
          echo "Throwaway signer certificate SHA-256: $(cat "$dir/cert-sha256")"
          echo "RP_KEY_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Build the release variant with publish-android.yml's own steps, and run its guards
        id: guards
        # A failed guard is a finding, not a reason to skip the device: the job fails at the end.
        continue-on-error: true
        run: python3 scripts/review-release-proof/run_publish_guards.py

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the release APK on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RP_OUT: ${{ github.workspace }}/android/build/release-proof
          RP_STUB_APK: ${{ runner.temp }}/app-release-stub.apk
          RP_PROD_APK: ${{ runner.temp }}/app-release-prod.apk
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: python3 scripts/review-release-proof/release_proof.py

      - name: Collect what the guards and the build said
        if: ${{ always() }}
        run: |
          mkdir -p build/release-proof
          cp "${RUNNER_TEMP}"/release-describe-*.txt "${RUNNER_TEMP}"/publish-guards.json build/release-proof/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/assemble-release.log" build/release-proof/ 2>/dev/null || true

      - name: Fail the job if a publish guard failed
        if: ${{ steps.guards.outcome == 'failure' }}
        run: |
          echo "::error::A publish-android.yml step failed against the throwaway-signed release; see the guard step."
          exit 1

      - name: Upload the results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-proof-${{ matrix.api-level }}
          path: android/build/release-proof/
          if-no-files-found: warn
          retention-days: 14
