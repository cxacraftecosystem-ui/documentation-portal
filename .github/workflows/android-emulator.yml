name: Android emulator smoke

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: "System image API level. API 37's images are named 37.0, 37.1 and 37.2."
        type: string
        default: "37.0"
      target:
        description: "google_apis, or google_apis_ps16k for a device with 16 KB memory pages"
        type: choice
        options:
          - google_apis
          - google_apis_ps16k
        default: google_apis
      unit-tests:
        description: "Only these JVM test classes (space-separated --tests patterns); skips the smoke"
        type: string
        default: ""
      device-tests:
        description: "Only these instrumented test classes (comma-separated); skips the smoke"
        type: string
        default: ""
      baseline-ref:
        description: "The released ref whose backend the stack job runs beside this one, to show what shipped"
        type: string
        default: "v0.0.3"
      parts:
        description: "all, or stack for only the record-save job against a CI backend"
        type: choice
        options:
          - all
          - stack
        default: all

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Targeted tests on an API ${{ inputs.api-level || '37.0' }} emulator
    if: ${{ inputs.unit-tests != '' || inputs.device-tests != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Run the named JVM tests
        if: ${{ inputs.unit-tests != '' }}
        env:
          UNIT_TESTS: ${{ inputs.unit-tests }}
        run: |
          set -euo pipefail
          args=()
          for pattern in $UNIT_TESTS; do args+=(--tests "$pattern"); done
          ./gradlew :app:testDebugUnitTest "${args[@]}" --console=plain

      - name: Enable KVM for the emulator
        if: ${{ inputs.device-tests != '' }}
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the named instrumented tests on the emulator
        if: ${{ inputs.device-tests != '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          DEVICE_TESTS: ${{ inputs.device-tests }}
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          target: ${{ inputs.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class="$DEVICE_TESTS"

      - name: Upload the test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-targeted-test-report
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    if: ${{ inputs.unit-tests == '' && inputs.device-tests == '' && inputs.parts != 'stack' }}
    name: Debug APK on an API ${{ inputs.api-level || '37.0' }} emulator (${{ inputs.target || 'google_apis' }}, ${{ matrix.part }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [device, ui]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Build the debug APK, as android-build.yml builds it
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/app-debug-androidTest.apk"

      - name: Build the release variant, unsigned, and read what it declares
        if: ${{ matrix.part == 'device' }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aapt2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt2"
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/release-badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" "$RUNNER_TEMP/release-badging.txt"
          grep -q "^targetSdkVersion:'37'" "$RUNNER_TEMP/release-badging.txt" ||
            { echo "::error::The release variant does not target SDK 37."; exit 1; }
          if grep -q "ACCESS_LOCAL_NETWORK" "$RUNNER_TEMP/release-badging.txt"; then
            echo "::error::The release variant declares ACCESS_LOCAL_NETWORK; only debug builds may."
            exit 1
          fi

      - name: Build a second debug APK pointed at the runner, for the local-network check
        if: ${{ matrix.part == 'device' }}
        run: |
          set -euo pipefail
          printf 'apiBaseUrl=http://10.0.2.2:8000/api/\n' > local.properties
          apk=app/build/outputs/apk/debug/app-debug.apk
          lan_ok() {
            unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/lan-dex"
            grep -aqF 'http://10.0.2.2:8000/api/' "$RUNNER_TEMP/lan-dex" &&
              ! grep -aqF 'https://d2b34i3e92al6i.cloudfront.net/api/' "$RUNNER_TEMP/lan-dex"
          }
          ./gradlew :app:assembleDebug --console=plain
          if ! lan_ok; then
            echo "::warning::The incremental build kept the production API base; rebuilding :app from scratch."
            ./gradlew :app:assembleDebug --console=plain --rerun-tasks
            lan_ok || { echo "::error::The local-network APK still carries the production API base."; exit 1; }
          fi
          rm local.properties
          cp "$apk" "$RUNNER_TEMP/app-debug-lan.apk"

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the device tests and the smoke script on the emulator
        if: ${{ matrix.part == 'device' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SMOKE_OUT: ${{ github.workspace }}/android/build/emulator-smoke
          SMOKE_PROD_APK: ${{ runner.temp }}/app-debug.apk
          SMOKE_LAN_APK: ${{ runner.temp }}/app-debug-lan.apk
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          target: ${{ inputs.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.fieldrepository.app.TopBarScanDeviceTest,com.fieldrepository.app.TopBarScanRealLookupDeviceTest,com.fieldrepository.app.DataMessageActivityTest,com.fieldrepository.app.explorer.ExplorerRealRetrofitTest
            python3 scripts/emulator-smoke.py

      - name: Run the UI test packages on the emulator
        if: ${{ matrix.part == 'ui' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SMOKE_OUT: ${{ github.workspace }}/android/build/emulator-smoke
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          target: ${{ inputs.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: |
            mkdir -p "$SMOKE_OUT"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" install -r -t "$RUNNER_TEMP/app-debug.apk"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" install -r -t "$RUNNER_TEMP/app-debug-androidTest.apk"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.ui com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/ui-test.txt" 2>&1; cat "$SMOKE_OUT/ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/ui-test.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.questionnaire com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/questionnaire-ui-test.txt" 2>&1; cat "$SMOKE_OUT/questionnaire-ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/questionnaire-ui-test.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.forms com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/forms-ui-test.txt" 2>&1; cat "$SMOKE_OUT/forms-ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/forms-ui-test.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.transcript com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/transcript-ui-test.txt" 2>&1; cat "$SMOKE_OUT/transcript-ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/transcript-ui-test.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.explorer com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/explorer-ui-test.txt" 2>&1; cat "$SMOKE_OUT/explorer-ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/explorer-ui-test.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb" shell am instrument -w -e package com.fieldrepository.app.language com.fieldrepository.app.test/androidx.test.runner.AndroidJUnitRunner > "$SMOKE_OUT/language-ui-test.txt" 2>&1; cat "$SMOKE_OUT/language-ui-test.txt"; grep -q "^OK (" "$SMOKE_OUT/language-ui-test.txt"

      - name: Upload the smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-smoke-${{ inputs.api-level || '37.0' }}-${{ inputs.target || 'google_apis' }}-${{ matrix.part }}
          path: android/build/emulator-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the instrumented-test report when the run fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-test-report-${{ inputs.api-level || '37.0' }}-${{ inputs.target || 'google_apis' }}-${{ matrix.part }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/build/emulator-smoke/
          if-no-files-found: warn
          retention-days: 14

  stack:
    if: ${{ inputs.unit-tests == '' && inputs.device-tests == '' }}
    name: Record saves on an emulator against a CI backend
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: field_repository
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      JWT_SECRET: "ci-android-stack-not-a-secret-0123456789abcdef"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_S3_BUCKET: "field-repository"
      AWS_S3_ENDPOINT: "http://127.0.0.1:9000"
      AWS_S3_PUBLIC_BASE_URL: "http://127.0.0.1:9000/field-repository"
      AWS_REGION: "us-east-1"
      AWS_S3_SSE_ALGORITHM: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the released backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline-ref || 'v0.0.3' }}
          path: baseline

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Prisma client and migrations
        working-directory: backend
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python -m prisma generate --schema prisma/schema.prisma
          python -m app.prisma_cli migrate deploy --schema prisma/schema.prisma

      - name: Seed the database
        working-directory: backend
        run: python ../scripts/ci/seed_tool_stack.py "$RUNNER_TEMP/tool-stack-seed.json"

      - name: Start this backend and the released one
        run: |
          set -euo pipefail
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 > "$RUNNER_TEMP/api-head.log" 2>&1 &)
          (cd baseline/backend && PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1 > "$RUNNER_TEMP/api-baseline.log" 2>&1 &)
          for port in 8000 8001; do
            up=0
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/health" >/dev/null; then up=1; break; fi
              sleep 2
            done
            if [ "$up" -ne 1 ]; then
              echo "::error::the API on port $port did not answer /health within three minutes"
              tail -n 200 "$RUNNER_TEMP/api-head.log" "$RUNNER_TEMP/api-baseline.log"
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build the debug APK and the device tests
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/app-debug-androidTest.apk"

      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Save tools from the device against both backends
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          STACK_OUT: ${{ github.workspace }}/android/build/stack-proof
          STACK_SEED: ${{ runner.temp }}/tool-stack-seed.json
          STACK_API: "http://10.0.2.2:8000/api/"
          STACK_BASELINE_API: "http://10.0.2.2:8001/api/"
        with:
          api-level: ${{ inputs.api-level || '37.0' }}
          target: ${{ inputs.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -no-snapshot-load -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: bash scripts/stack-proof.sh

      - name: The backend logged the refusal by field path and type
        run: |
          set -euo pipefail
          grep -F "body.toolkitName" "$RUNNER_TEMP/api-head.log"

      - name: Keep the API logs
        if: ${{ always() }}
        run: |
          mkdir -p android/build/stack-proof
          cp "$RUNNER_TEMP/api-head.log" "$RUNNER_TEMP/api-baseline.log" android/build/stack-proof/ || true

      - name: Upload the stack results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-stack-${{ inputs.api-level || '37.0' }}-${{ inputs.target || 'google_apis' }}
          path: android/build/stack-proof/
          if-no-files-found: warn
          retention-days: 14
