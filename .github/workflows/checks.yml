name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://ci:ci@ci.invalid:5432/no_such_database"
      JWT_SECRET: "ci-placeholder-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip check

      - name: Generate the Prisma client
        run: python -m prisma generate --schema prisma/schema.prisma

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/designer-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO DESIGNER_PORTAL_DIR
        run: bash scripts/ci/peer_checkout.sh

      - name: Install LibreOffice for the report round-trip test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui
          soffice --version

      - name: Run the suite
        env:
          REQUIRE_LIBREOFFICE: "1"
        run: |
          set -uo pipefail

          cat > expected-failures.txt <<'LIST'
          LIST

          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-output.log; then
            status=1
          fi

          grep -E '^(FAILED|ERROR) ' pytest-output.log \
            | sed -E 's/^(FAILED|ERROR)[[:space:]]+//; s/[[:space:]]+-[[:space:]].*$//' \
            | sort -u > actual-failures.txt || :

          summary=$(grep -E '^=+ .*(passed|failed|error).*=+$' pytest-output.log | tail -n 1 || :)
          passed=$(printf '%s\n' "$summary" | sed -nE 's/.*[^0-9]([0-9]+) passed.*/\1/p')
          echo "pytest summary line: ${summary:-<none>}"
          if [ "${passed:-0}" -lt 900 ]; then
            echo "::error::pytest reported only ${passed:-0} passing tests, far below the 1019 measured when this job landed. The suite did not really run — look for collection errors, a wrong testpaths, or a wrong working directory. A green tick here would be meaningless."
            exit 1
          fi

          rc=0
          unexpected=""
          unexpected=$(grep -vxFf expected-failures.txt actual-failures.txt) || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not compare the expected-failure list against this run (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          while IFS= read -r nodeid; do
            [ -n "$nodeid" ] || continue
            if ! grep -qxF "$nodeid" actual-failures.txt; then
              echo "::warning::${nodeid} no longer fails. Delete its line from expected-failures.txt in .github/workflows/checks.yml — that list may only shrink, and an entry describing nothing is how it rots."
              printf '%s\n' "- :tada: \`${nodeid}\` no longer fails — delete its line from the expected-failure list in \`.github/workflows/checks.yml\`." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done < expected-failures.txt

          if [ -n "$unexpected" ]; then
            {
              echo "### Backend tests: unexpected failures"
              echo ""
              echo "Not on the known-failure list in \`.github/workflows/checks.yml\`:"
              echo ""
              printf '%s\n' "$unexpected" | sed 's/^/- `/; s/$/`/'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            printf '%s\n' "$unexpected" | while IFS= read -r nodeid; do
              echo "::error::${nodeid} failed, and it is not on the expected-failure list (which is empty). That is a regression, not the baseline."
            done
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Only failures on the expected-failure list fired; the comment on this step says what each one is and how to fix it."
          fi
          exit 0

  web:
    name: Web typecheck, lint and unit specs
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: |
          npm install --global npm@12
          npm --version

      - name: Install
        run: npm ci

      - name: Audit the lockfile
        run: npm audit --audit-level=low

      - name: Typecheck (TypeScript 7)
        run: npx tsc --noEmit

      - name: Typecheck (TypeScript 6, the compiler next build runs)
        run: npx tsc6 --noEmit

      - name: Lint
        run: npm run lint

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/designer-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO DESIGNER_PORTAL_DIR
        run: bash scripts/ci/peer_checkout.sh

      - name: Unit specs
        run: npm run test:unit

  map-coverage:
    name: Map coverage view in a browser
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Run the spec against the built site
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          E2E_SHOT_DIR: test-results/map-coverage
        run: |
          set -euo pipefail
          npx next start --port 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3000/login || { cat next.log; exit 1; }
          npx playwright test e2e/map-coverage.spec.ts

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-coverage
          path: frontend/test-results
          if-no-files-found: ignore


