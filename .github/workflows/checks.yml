  docs:
    name: Docs check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          check-latest: true

      - name: Verify the documentation set
        run: |
          set -uo pipefail

          cat > known-doc-problems.txt <<'LIST'
          LIST

          status=0
          if ! node docs/tools/check-docs.mjs 2>&1 | tee docs-check.log; then
            status=1
          fi

          rc=0
          grep -E '^FAIL' docs-check.log > doc-problems.txt || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not read the docs-check output (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          paths=$(sed -nE 's/.*[^0-9]([0-9]+) repository paths resolved.*/\1/p' docs-check.log | tail -n 1)
          echo "check-docs resolved ${paths:-0} repository paths"
          if [ "${paths:-0}" -lt 200 ]; then
            echo "::error::check-docs resolved only ${paths:-0} repository paths, far below the 400-odd measured when this job landed. It did not inspect the documentation set, so a green tick here would be meaningless."
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ ! -s doc-problems.txt ]; then
            echo "::error::check-docs exited non-zero without printing a single FAIL line, so it crashed rather than found problems. Read the log above."
            exit 1
          fi

          rc=0
          unexpected=""
          unexpected=$(grep -vFf known-doc-problems.txt doc-problems.txt) || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not compare the known-problem list against this run (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          while IFS= read -r known; do
            [ -n "$known" ] || continue
            if ! grep -qF "$known" doc-problems.txt; then
              echo "::warning::the documentation problem '${known}' is fixed. Delete its line from known-doc-problems.txt in .github/workflows/checks.yml — that list may only shrink."
              printf '%s\n' "- :tada: fixed: \`${known}\` — delete its line from the known-problem list in \`.github/workflows/checks.yml\`." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done < known-doc-problems.txt

          if [ -n "$unexpected" ]; then
            {
              echo "### Docs check: new problems"
              echo ""
              echo "Not on the known-problem list in \`.github/workflows/checks.yml\`:"
              echo ""
              printf '%s\n' "$unexpected" | sed 's/^/- /'
              echo ""
              echo "If one of them is \`docs/REPO_FACTS.md is out of date\`, run \`node docs/tools/check-docs.mjs --write\` and commit the result."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::check-docs reported a documentation problem that is not on the known-problem list — which is currently EMPTY, so this is simply a new problem. See the run summary; fix it, or argue for it in review before adding it to the list in this workflow."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Only the known pre-existing documentation problems were reported; the comment on this job says what each one is and who fixes it."
          fi
          exit 0

  backend-db:
    name: Backend database tests
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: field_repository
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      JWT_SECRET: "ci-db-tests-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
      SEARCH_DB_TESTS: "1"
      ARTISAN_CARD_DB_TESTS: "1"
      ARTISAN_DUPLICATE_DB_TESTS: "1"
      TRANSCRIPT_INSIGHTS_DB_TESTS: "1"
      QV2_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      REVIEW_SQL_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      RECORD_COMPLETENESS_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      QV2_BACKFILL_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository_backfill"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Fetch the Prisma engines and generate the client
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python -m prisma generate --schema prisma/schema.prisma

      - name: Create the backfill database and apply the migrations to both
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE field_repository_backfill'
          python -m app.prisma_cli migrate deploy --schema prisma/schema.prisma
          DATABASE_URL="$QV2_BACKFILL_DATABASE_URL" python -m app.prisma_cli migrate deploy --schema prisma/schema.prisma

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/designer-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO DESIGNER_PORTAL_DIR
        run: bash scripts/ci/peer_checkout.sh

      - name: Run the suite against the database
        run: |
          set -uo pipefail
          status=0
          if ! python -m pytest -rfs --durations=15 | tee pytest-db.log; then
            status=1
          fi
          gated=$(grep -E '^SKIPPED .*(_DB_TESTS|_DATABASE_URL|DATABASE_URL naming a running Postgres)' pytest-db.log || :)
          if [ -n "$gated" ]; then
            printf '%s\n' "$gated"
            echo "::error::database-backed tests still skipped on their opt-in gate. Add the variable they read to this job's env."
            exit 1
          fi
          exit "$status"

