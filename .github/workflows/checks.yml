          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      JWT_SECRET: "ci-web-stack-not-a-secret-0123456789abcdef"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_S3_BUCKET: "field-repository"
      AWS_S3_ENDPOINT: "http://127.0.0.1:9000"
      AWS_S3_PUBLIC_BASE_URL: "http://127.0.0.1:9000/field-repository"
      AWS_REGION: "us-east-1"
      AWS_S3_SSE_ALGORITHM: ""
      QUESTIONNAIRE_V2: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Prisma client and migrations
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python -m prisma generate --schema prisma/schema.prisma
          python -m app.prisma_cli migrate deploy --schema prisma/schema.prisma

      - name: Start a throwaway bucket
        run: |
          set -euo pipefail
          docker run -d --name qv2-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do
            if docker exec qv2-minio mcli alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec qv2-minio mcli mb --ignore-existing local/field-repository

      - name: Seed the database
        run: python ../scripts/ci/seed_qv2_stack.py "$RUNNER_TEMP/qv2-seed.json"

      - name: Start the API
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then echo "API is up."; exit 0; fi
            sleep 2
          done
          echo "::error::the API did not answer /health within two minutes"
          tail -n 200 "$RUNNER_TEMP/api.log"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12 and the web dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@12
          npm ci

      - name: The web outbox and the forms library against the stack
        working-directory: frontend
        env:
          QV2_STACK_API: "http://127.0.0.1:8000"
        run: |
          set -uo pipefail
          export QV2_STACK_SEED="$RUNNER_TEMP/qv2-seed.json"
          status=0
          npx playwright test e2e/questionnaire-v2-stack.spec.ts e2e/questionnaire-library-stack.spec.ts || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- API log (last 200 lines) ---"
            tail -n 200 "$RUNNER_TEMP/api.log"
          fi
          exit "$status"

  questionnaire-unify-backfill:
    name: Questionnaire unify backfill
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: field_repository
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository"
      QUESTIONNAIRE_UNIFY_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/field_repository_unify"
      JWT_SECRET: "ci-unify-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Fetch the Prisma engines and generate the client
        run: |
          set -euo pipefail
          python -m prisma py fetch
          python -m prisma generate --schema prisma/schema.prisma

      - name: Create the empty database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE field_repository_unify'

      - name: The backfill, before and after U0, and the deferred migrations
        run: |
          set -uo pipefail
          status=0
          python -m pytest -rs --durations=10 tests/test_questionnaire_unify_backfill.py | tee unify.log || status=1
          if grep -q '^SKIPPED' unify.log; then
            echo "::error::the backfill test skipped; QUESTIONNAIRE_UNIFY_DATABASE_URL must reach the empty database."
            exit 1
          fi
          exit "$status"

  questionnaire-parity:
    name: Questionnaire parity (both portals)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://ci:ci@ci.invalid:5432/no_such_database"
      JWT_SECRET: "ci-placeholder-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Generate the Prisma client
        run: python -m prisma generate --schema prisma/schema.prisma

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/designer-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PEER_ENV_NAMES: CROSS_PORTAL_PEER_REPO SIBLING_REPO DESIGNER_PORTAL_DIR
        run: bash scripts/ci/peer_checkout.sh

      - name: The manifest, the schema fragment and the feature registry, in both portals
        run: |
          set -uo pipefail
          status=0
          python -m pytest -rs tests/test_questionnaire_parity.py tests/test_questionnaire_schema_parity.py             tests/test_questionnaire_feature_parity.py | tee parity.log || status=1
          if grep -q '^SKIPPED' parity.log; then
            echo "::error::a questionnaire parity check skipped; every one must run against the other portal here."
            exit 1
          fi
          exit "$status"

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck --version && shellcheck -x backend/deploy/blue_green.sh backend/deploy/test_blue_green.sh

      - name: Release logic against stubs
        run: bash backend/deploy/test_blue_green.sh

      - name: Backup freshness verdict against fixed clocks
        run: shellcheck -x scripts/ci/backup_freshness.sh scripts/ci/test_backup_freshness.sh && bash scripts/ci/test_backup_freshness.sh

      - name: Peer checkout against a local peer that pushes late, moves on, or differs
        run: shellcheck -x scripts/ci/peer_checkout.sh scripts/ci/test_peer_checkout.sh && bash scripts/ci/test_peer_checkout.sh

      - name: Android publish gate against stubbed deploy runs and /health
        run: shellcheck -x scripts/ci/await_backend_release.sh scripts/ci/test_await_backend_release.sh && bash scripts/ci/test_await_backend_release.sh

      - name: Release gate harness, read-only client and summary
        run: shellcheck -x scripts/release_gate/run.sh && python3 scripts/release_gate/test_gate.py -v

  shared-manifests:
    name: Shared-file manifests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every shared file matches this repository's manifests
        run: |
          set -euo pipefail
          python3 scripts/sync_data_report.py --check

  comment-stripper:
    name: Comment stripper
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install the frontend's TypeScript
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Self-test
        run: python scripts/tools/test_strip_comments.py -v

      - name: Stripped copies parse the same
        run: |
          python scripts/tools/strip_comments.py --out "$RUNNER_TEMP/stripped"
          node scripts/tools/verify_strip_ts.mjs "$RUNNER_TEMP/stripped"
          find "$RUNNER_TEMP/stripped" -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python scripts/tools/verify_strip_workflows.py .github/workflows "$RUNNER_TEMP/stripped/.github/workflows"

      - name: No comments remain
        run: python scripts/tools/strip_comments.py --check
