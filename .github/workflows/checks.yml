name: Checks

# ─── WHAT THIS EXISTS TO STOP ────────────────────────────────────────────────────────────
# Until this file landed, NOTHING IN THIS REPOSITORY RAN A TEST. Not on a pull request, not on a
# push, not anywhere. The other workflows are NAMED here rather than counted, because a count is the
# one fact in a header that a new file falsifies silently and nobody re-reads:
#   • deploy-backend.yml   — `push: main`. Deploys. Runs no test.
#   • deploy-frontend.yml  — `workflow_run` after the backend. Deploys. Runs no test.
#   • android-build.yml    — the only one with a `pull_request` trigger, and it is path-filtered to
#                            `android/**` (android-build.yml:31-33). It compiles Kotlin, runs the
#                            Android unit tests and builds a DEBUG apk. Nothing it produces can
#                            reach a handset.
#   • keep-supabase-active.yml — a nightly cron that pings Postgres so the free tier does not idle
#                            out. It asserts nothing about the code.
#   • backup-db.yml        — a scheduled `pg_dump` to S3. Also asserts nothing about the code.
# So on 2026-09-14 this repository held 1023 backend test cases, 104 web unit specs and 8 Kotlin test
# files, all of them green, and a pull request could break any of them and still show a clean list of
# checks. Every guard anybody has written here ran only when a human remembered to type the command.
#
# ─── THE DRIFT THIS CATCHES IS NOT HYPOTHETICAL ──────────────────────────────────────────
# This repository states the same rule on three surfaces, and three copies of a rule is a rule that
# drifts. The tests that pin them together are the ones nothing was running:
#   • android/app/src/test/java/com/fieldrepository/app/ui/WalkthroughStepsTest.kt:385 declares
#     `WEB_GUIDE_PATH = "frontend/components/guide/steps.ts"` and READS THAT FILE OUT OF THE WEB
#     TREE (the `..`-prefixed walk at :520-528), asserting that the Kotlin walkthrough and the web
#     walkthrough declare the same steps, in the same order, with the same cautions.
#   • RecordPickersTest.kt and AccessRosterTest.kt name `frontend/components/forms/recordPickers.ts`
#     and `frontend/lib/accessRoster.ts` as their twins in their own headers: "Change one, change
#     both."
# READ THAT WITH android-build.yml:31-33 AND THE HOLE IS OBVIOUS: a frontend-only pull request does
# not match `android/**`, so the one test that would notice the web half moving away from the Kotlin
# half is the one test that does not run. THIS FILE DOES NOT CLOSE THAT HOLE — see "WHAT IS
# DELIBERATELY NOT HERE" below — it writes it down with a file and a line so the next person can.
#
# ─── THIS WORKFLOW RUNS. IT DOES NOT, BY ITSELF, GATE ANYTHING ───────────────────────────
# Nothing in `.github/` can prove a job BLOCKS a merge: required status checks live in the
# repository's branch-protection settings, not in a workflow file. (A deploy is different: the two
# deploy workflows wait for this one — item 2.) Read a green Checks tick as "the guards were asked",
# not as "main is protected".
#
# Two specific things it does NOT do, stated because a green tick read as more than it is costs more
# than no tick at all:
#   1. It does not block a merge unless `Backend tests`, `Web typecheck, lint and unit specs` and
#      `Docs check` are named as required checks on `main` (Settings → Branches → branch protection).
#      Those names are stable on purpose; renaming a job silently un-requires it.
#   2. It does not block a DEPLOY by itself; each deploy stage waits for it. deploy-backend.yml fires
#      on its own `push: main` trigger and one workflow cannot `needs:` a job in another, so on main
#      this workflow and the deploy chain still START together, and when this header was written
#      the deploy usually won — an rsync starts faster than a minute of pytest. The sibling
#      repository's fix, now ported to both stages, closes that race from the other end: a
#      `wait-for-checks` job inside each deploy stage polls for the Checks run at the exact SHA
#      being shipped and refuses to hand over until these three jobs are green. deploy-backend.yml's
#      copy (2026-09-20) runs on a push that touches backend/; deploy-frontend.yml's (2026-10-09)
#      covers the frontend-only push the backend's copy never sees. Both find these jobs by the
#      names in their `GATING_JOBS` lists, so renaming one here also stalls every gated deploy until
#      its twenty-minute wait fails, naming the job it was waiting for. The manual-dispatch override
#      skips both waits on purpose (docs/CI.md §4).
#
# ─── WHY NO `paths:` FILTER ──────────────────────────────────────────────────────────────
# Deliberate, and it is the specific mistake this file exists to not repeat. The sibling repository's
# checks.yml puts it in one sentence — "A path filter is how android-build.yml ended up unreachable
# from a backend PR … a filter would buy a few minutes and cost the property that makes this
# workflow worth having — that EVERY pull request runs it. Do not add one." — and this repository is
# the one where that cost is already being paid: android-build.yml:31-33 IS that filter, and the
# paragraph above names the test it makes unreachable. The three jobs below are cheap (measured on a
# laptop 2026-09-14: 65 s of pytest, 8 s of Playwright, under a second of docs check) and
# independent of each other. DO NOT ADD ONE.
#
# ─── WHY THE `uses:` LINES ARE COMMIT SHAS — THEY WERE TAGS UNTIL 2026-10-09 ─────────────
# `actions/checkout@v4` is a MUTABLE tag: whoever controls that repository can move it, and the next
# run then executes different code with no diff to review. A commit SHA cannot move, so every `uses:`
# below names one, with the release it was taken from in a trailing comment for the reader.
#
# Until 2026-10-09 this paragraph argued for tags, and the argument was about what was missing, not
# about pins: a hand-pinned SHA with nothing to refresh it is a pin that silently rots — you lose the
# fixes in v4.x and gain no signal that you have — and on 2026-09-14 this repository had no
# `.github/dependabot.yml` (`.github/` held `workflows/` and nothing else). It asked for that file
# and the pins together, across every workflow rather than here for one, and both landed on
# 2026-10-09: the file (github-actions, weekly) and a pin on every `uses:` in all six workflows that
# have one (backup-db.yml uses no action). Five were pinned that morning to the commit their old tag
# (`@v4`, `@v5`) resolved to, which changed nothing that ran; deploy-backend.yml's waited for a real
# backend change, because any edit to that file redeploys the backend, and went in with the move to
# Python 3.14 the same day. In that change every pin, in every workflow, moved to the LATEST release
# of its action (actions/checkout v7.0.1, setup-python v7.0.0, setup-node v7.1.0, setup-java v6.0.1,
# upload-artifact v7.0.2, download-artifact v8.0.2, webfactory/ssh-agent v0.10.0), each SHA read back
# through `gh api` from the release tag. A bump is now a Dependabot pull request that a reviewer can
# read. A bump by hand re-resolves the tag and changes the SHA and its comment together: a SHA whose
# comment names a different release misleads every later reviewer. The check and the recipe are in
# docs/CI.md, "How this document is kept true".
#
# ─── WHAT IS DELIBERATELY NOT HERE ───────────────────────────────────────────────────────
# • NO ANDROID JOB. android-build.yml already compiles Kotlin and runs `:app:testDebugUnitTest` on a
#   pull request, and a second Gradle job would spend five more minutes to learn the same thing. What
#   is missing is not a job, it is two lines in somebody else's file: `frontend/**` added to
#   android-build.yml:32-34, without which the cross-surface parity tests named above cannot see the
#   change that breaks them. That is an android-workstream edit; docs/CI.md §5 asks for it by name.
# • NO RUFF. `ruff` is in the dev extra (and in backend/requirements.lock) and `[tool.ruff]` in
#   backend/pyproject.toml sets only `line-length` and `target-version` — there is no rule selection,
#   so `ruff check` runs whatever default set the installed release ships and nothing anybody chose.
#   That set is not small any more: ruff 0.16.10 (the locked version) reports 424 findings on this
#   tree at target py314 (398 at the old py311; measured 2026-10-09), none of them a gate today.
#   Wiring a linter into CI before the rule set exists gates on an accident. Choose the rules in
#   pyproject first (the sibling repository's `[tool.ruff.lint]` is the worked example, dated per-file
#   baseline included), then add the step.
# • NO PLAYWRIGHT E2E, NO BACKEND INTEGRATION. Both need a running app, a database, and credentials.
#   That is a genuinely larger piece of work than these three jobs, and pretending otherwise by
#   half-wiring it is how a suite ends up "running" against nothing. docs/CI.md §5 keeps it listed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Safe to cancel, unlike the deploy workflows: nothing outside the runner is mutated here. Keyed per
  # pull request (or per branch on a push) so two open pull requests never cancel each other. On main a
  # push cancels the previous commit's run while it is still going, and the deploy workflows'
  # wait-for-checks treat a run cancelled this way as SUPERSEDED once main has moved past its commit
  # (2026-10-09): that commit's pipeline ends green and ships nothing, and the newer commit's run ships
  # both. A run cancelled while its commit is still main's tip is not superseded — the wait holds for a
  # re-run or a dispatch of Checks, then fails as cancelled, not failed. A dispatch on main cancels the
  # push run for the same commit too; the wait grades the run that was not cancelled. See docs/CI.md §1
  # and §6.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 1 · The backend suite
  # ═══════════════════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend

    # ─── THE ENVIRONMENT, AND WHY THESE VALUES LOOK LIKE THAT ────────────────────────────
    # THERE IS NO DATABASE IN THIS JOB AND THERE MUST NOT BE ONE. These six values exist only
    # because `app.core.config.Settings` declares them as REQUIRED fields with no default —
    # DATABASE_URL (backend/app/core/config.py:78), JWT_SECRET (:101), AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY (:167-168), AWS_S3_BUCKET (:170), MASTER_ADMIN_EMAIL (:187) — and their
    # only other source is `backend/.env` (config.py:314-319), which is gitignored and therefore
    # ABSENT on a runner. With them unset `Settings()` refuses to build, and a plain `pytest` here
    # would not fail some tests: it would fail to COLLECT, because nearly every module reaches
    # `app.core.config` through an import. The suite would be red for a reason that has nothing to do
    # with the code under test, on every run, forever.
    #
    # EVERY VALUE IS CHOSEN TO BE UNUSABLE. The DSN names `ci.invalid` — RFC 2606 reserves `.invalid`
    # precisely so it can never resolve — so even a test that tried to connect could not reach
    # anything, let alone a real database. The secret is obviously not a secret, the AWS credentials
    # are obviously not credentials, the admin address is `.invalid` too. A placeholder that could be
    # mistaken for a real value is how a real value ends up here later.
    #
    # THAT NOTHING CONNECTS IS MEASURED, NOT ASSUMED. The whole suite was run on 2026-09-14 with
    # exactly this environment and that unresolvable DSN: 1021 passed, 2 failed, ZERO skipped, 65 s.
    # A suite that opened a connection could not do that — it would hang on DNS or error out, not
    # pass. Zero skipped matters in its own right: unlike the sibling repository, this suite has NO
    # database-gated modules that take themselves out (backend/tests/conftest.py is ten lines and
    # does nothing but extend `sys.path`), so "what runs here" is the whole suite, and a green tick
    # cannot be hiding a population of tests that quietly opted out.
    #
    # DO NOT "improve" any of these into something real, and DO NOT add a Postgres service container.
    # A database here would promote the suite from "cannot touch data" to "runs against whatever CI
    # happens to have", which is a different suite with different failure modes, unreviewed.
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: "postgresql://ci:ci@ci.invalid:5432/no_such_database"
      JWT_SECRET: "ci-placeholder-not-a-secret-0123456789abcdef"
      AWS_ACCESS_KEY_ID: "ci-placeholder"
      AWS_SECRET_ACCESS_KEY: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      MASTER_ADMIN_EMAIL: "ci@example.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.14.8 EXACTLY, because that is what production runs: deploy-backend.yml builds the EC2
          # box's venv on upstream CPython 3.14.8 from a pinned python-build-standalone build (since
          # 2026-10-09; the box ran 3.12 until that morning, and so did this line). A suite that
          # passes on a version production does not have is a weaker statement than it looks, and
          # that is as true of a patch release as of a minor. backend/pyproject.toml requires >= 3.14.
          #
          # A FULL VERSION, NOT "3.14" WITH `check-latest`. The runner image caches whichever 3.14.x
          # it was built with (3.14.4 on ubuntu-26.04 image 20260927), so "3.14" alone tested 3.14.4;
          # `check-latest` fixed that by fetching the newest 3.14 from actions/python-versions
          # (3.14.8 on 2026-10-09), but the newest is not what the box runs the day a 3.14.9 lands
          # before the box's pin moves. An exact version is fetched from that manifest when the
          # image lacks it, and needs no `check-latest`. It moves with the box's pin, which
          # deploy-backend.yml's build step and infra/terraform/user_data.sh carry (the build step
          # says why it is not 3.15 yet); backend/tests/test_interpreter_pin.py fails while the
          # three disagree.
          #
          # THE VERSION IS NOT COSMETIC HERE, AND IT USED TO BE MEASURED BY TWO RED TESTS. pydub
          # imports `audioop`, which PEP 594 removed from the standard library in 3.13, so on 3.14
          # `import pydub` failed outright and backend/app/api/routes/data_browser.py:3059 answered
          # 503 before the size checks the two test_manifest_stream.py tests exist for. audioop-lts
          # (pyproject.toml, with a python_version >= '3.13' marker) puts the module back, and both
          # tests pass on 3.14 since 2026-10-09.
          python-version: "3.14.8"
          cache: pip
          # Both files: the lock decides the installed set, and pyproject is what a refresh of the
          # lock is compiled FROM, so a change to either must not reuse the other's cache.
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install the backend from the lock
        # ─── FROM backend/requirements.lock, SINCE 2026-10-09 ────────────────────────────────────
        # The pip lines below are the ones the EC2 deploy runs (the Docker image runs only the lock
        # line), so CI, the box and a developer's venv install ONE set of versions. Before the
        # lock every dependency was a `>=` floor and this step took whatever the index offered that
        # day, which is how two tests in test_public_census.py went red with no commit behind them:
        # FastAPI 0.137 changed what `APIRouter.routes` holds, and the floor moved under the tests.
        # (They are fixed; see that file's `_mounted_routes`.)
        #
        # The lock is compiled from pyproject.toml WITH the `dev` extra, so pytest, ruff and httpx
        # come from it too; `--no-deps` on the editable install is what keeps it authoritative —
        # without it pip re-resolves pyproject's floors and can quietly lift a pin. Refresh it
        # deliberately, in a python:3.14 container, never as a side effect of something else; the
        # command and its two traps are in docs/CI.md, "The backend dependency lock".
        #
        # `pip check` LAST, AND IT IS THE ONLY THING THAT NOTICES A STALE LOCK. `--no-deps` means
        # nothing above compares pyproject's floors with the lock's pins, so a pull request that
        # raises a floor without recompiling the lock — exactly what a Dependabot pip pull request
        # does, since it cannot touch a `.lock` — would install the old pin and go green. pip check
        # reads both and fails on the disagreement ("has requirement fastapi>=X, but you have Y").
        #
        # ─── pytest-asyncio IS NOT INSTALLED, AND THAT IS CORRECT ────────────────────────
        # It is in no extra and so not in the lock, and pyproject.toml sets no `asyncio_mode` (its
        # note says why that line was removed on 2026-09-14). Every async module in the suite declares
        # `pytestmark = pytest.mark.anyio`, so ANYIO's pytest plugin runs them, and anyio is installed
        # through starlette and httpx. Do not read a missing async runner as "they pass anyway":
        # probed on this pytest, an async test with no plugin to run it FAILS loudly with "async def
        # functions are not natively supported" — it does not quietly go green.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip check

      - name: Generate the Prisma client
        # `from prisma import Prisma` in app/core/db.py resolves against code that `prisma generate`
        # writes into the installed package; without this step every module that reaches app.core.db
        # fails to import and the suite cannot collect. It talks to the schema and to the engine
        # download, NOT to a database — no migration runs and nothing connects.
        run: python -m prisma generate --schema prisma/schema.prisma

      - name: Run the suite
        # THE WHOLE SUITE, not a hand-written selection. A `-k` expression is a list that goes stale
        # the day somebody adds a file, and the guards this workflow exists for are exactly the kind
        # nobody remembers to add to a list.
        #
        # ─── THE EXPECTED-FAILURE LIST, WHICH IS EMPTY, AND WHY IT IS STILL A LIST ──────────
        # THIS TREE DID NOT START GREEN. Four tests were failing when this job landed (2026-09-14), and
        # a job that is red on day one is a job somebody disables — so they were named here, one line
        # each, with what was wrong with each. Not `|| true`, not `--deselect`, not a count. All four
        # were fixed on 2026-10-09 and their lines deleted:
        #   • test_public_census.py's two route tests read `api_router.routes`, which FastAPI 0.137
        #     turned into a tree of `_IncludedRouter` wrappers with no `.path`; they now ask FastAPI's
        #     public `iter_route_contexts` (added in 0.137.2 for exactly that), router-level
        #     dependencies included.
        #   • test_manifest_stream.py's two size-refusal tests got a 503 instead of a 413 wherever
        #     Python was 3.13+, because pydub imports the `audioop` module PEP 594 removed; the
        #     audioop-lts backport is now a dependency, and this job runs 3.14 like production.
        #
        # SO THE LIST IS EMPTY AND THE GATE IS A REAL ONE: any FAILED or ERROR line fails the job. The
        # mechanism stays, because the next day-one red will need it, and the docs job below is the
        # precedent for an empty licence: an empty pattern file matches nothing, so `grep -v` reports
        # every failure as unexpected, which is the correct reading.
        #
        # WHY A LIST OF NODE IDS RATHER THAN "expect N failures", if one is ever added back: a count
        # cannot tell one failure from another. Fix one, break another, and the count still matches —
        # green, over a regression. A list goes red the moment a different test fails, and on a
        # collection ERROR too, because an ERROR line is a failure it has not licensed.
        #
        # WHY A LIST RATHER THAN `--deselect`: a deselected test never runs, so the day somebody fixes
        # it nothing notices, and the day it starts failing for a SECOND, unrelated reason nothing
        # notices either. A listed test runs, its traceback is in the log, and it is simply not fatal.
        #
        # THE LIST MAY ONLY SHRINK. An expected failure that stops failing prints a ::warning naming
        # the line to delete, and says so in the run summary — deliberately not a hard failure,
        # because "your tree got better" must never be the thing that turns a pull request red.
        # Deleting a line is a one-line, reviewable diff. ADDING one is the thing to argue about in
        # review.
        #
        # `-rf` and no `-q`: the failure summary at the foot is the one thing a reader scrolling to
        # the bottom of a red log came for, and it is what this gate parses. `--durations=15` because
        # a suite getting slow is the other thing nobody notices until it is minutes.
        #
        # MEASURED on this tree, not estimated, 2026-09-14 (laptop, Python 3.14.7): 1019 passed, 4
        # failed, 0 skipped, 54 s; with the 3.12 behaviour simulated, 1021 passed, 2 failed, 65 s.
        # And 2026-10-09 on this job itself (ubuntu-26.04, Python 3.14.8, installed from the lock):
        # 1349 passed, 0 failed, 77 s — run 37928429051.
        # Those are a snapshot of a healthy run, NOT a target — totals move the day anybody adds a
        # test, and reconciling a CI log against a number typed into a comment is how people learn to
        # argue with the log. The FLOOR below is the only number this step enforces.
        run: |
          set -uo pipefail

          cat > expected-failures.txt <<'LIST'
          LIST

          status=0
          if ! python -m pytest -rf --durations=15 | tee pytest-output.log; then
            status=1
          fi

          # ⚠ THE `|| :` BELOW IS LOAD-BEARING, AND IT IS THE GREEN CASE IT PROTECTS. GitHub runs
          # this block as `bash -e {0}`; the script sets `-uo pipefail` and never clears `-e`. A suite
          # with NO failures gives grep nothing to match, grep exits 1, `pipefail` promotes that to the
          # pipeline's status, and `-e` kills the step — so this job would go red on the very day the
          # backend suite finally went green, printing none of the messages below. `actual-failures.txt`
          # is simply empty in that case, which every comparison below already reads correctly.
          # Node ids only: `FAILED tests/x.py::y - AssertionError: ...` becomes `tests/x.py::y`.
          # ERROR lines are collected too — a module that cannot import is a failure nothing licensed.
          grep -E '^(FAILED|ERROR) ' pytest-output.log \
            | sed -E 's/^(FAILED|ERROR)[[:space:]]+//; s/[[:space:]]+-[[:space:]].*$//' \
            | sort -u > actual-failures.txt || :

          # ── A FLOOR, NOT A TARGET ────────────────────────────────────────────────────
          # pytest reports success just as cheerfully over four tests as over a thousand, so a broken
          # `testpaths`, a bad working directory, or a collection that quietly lost most of the suite
          # would leave this step green while asserting almost nothing. 1019 passed on the day this
          # landed; 900 is far enough below that ordinary deletion never reaches it and far enough
          # above zero that losing a directory does. A MISSING summary line reads as 0 and goes red,
          # which is the right answer when pytest died before it could count anything.
          # `|| :` for the same reason, and here it preserves a DIAGNOSTIC: with no summary line at all
          # the floor below reports 0 passing tests and says why. Without it the step dies silently.
          summary=$(grep -E '^=+ .*(passed|failed|error).*=+$' pytest-output.log | tail -n 1 || :)
          passed=$(printf '%s\n' "$summary" | sed -nE 's/.*[^0-9]([0-9]+) passed.*/\1/p')
          echo "pytest summary line: ${summary:-<none>}"
          if [ "${passed:-0}" -lt 900 ]; then
            echo "::error::pytest reported only ${passed:-0} passing tests, far below the 1019 measured when this job landed. The suite did not really run — look for collection errors, a wrong testpaths, or a wrong working directory. A green tick here would be meaningless."
            exit 1
          fi

          # ── ANY FAILURE THIS LIST DOES NOT NAME IS A RED RUN ─────────────────────────
          # `-x` so a node id must match a WHOLE line: without it a shorter name could license a
          # longer, different one. grep's status is read rather than swallowed — 1 means "nothing
          # unexpected", which is the good case, and 2 or more means grep itself failed, which must
          # never be read as success.
          # ⚠ `|| rc=$?`, NOT A BARE CALL. The comment above is right that 1 means "nothing
          # unexpected, which is the good case" — but `rc=$?` on the next line never runs under
          # `bash -e`, because the assignment has already killed the step. THIS IS THE TRAP THAT FIRES
          # ON SUCCESS, and it is why it stayed invisible: every run of this job to date failed on a
          # real test failure, so the good case was never reached. A `||` list exempts the grep from
          # `-e` and keeps exactly the rc semantics the comment describes.
          rc=0
          unexpected=""
          unexpected=$(grep -vxFf expected-failures.txt actual-failures.txt) || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not compare the expected-failure list against this run (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          # ── AN EXPECTED FAILURE THAT PASSED IS NEWS, NOT AN ERROR ────────────────────
          # `${GITHUB_STEP_SUMMARY:-/dev/null}` here and below, rather than the bare variable: this
          # whole block is written to be runnable outside Actions — it is how it was verified, and it
          # is how the next person will debug it — and under `set -u` an unset GITHUB_STEP_SUMMARY
          # aborts the script three lines before it would have said what was wrong. Found by running
          # it locally with a synthetic log.
          while IFS= read -r nodeid; do
            [ -n "$nodeid" ] || continue
            if ! grep -qxF "$nodeid" actual-failures.txt; then
              echo "::warning::${nodeid} no longer fails. Delete its line from expected-failures.txt in .github/workflows/checks.yml — that list may only shrink, and an entry describing nothing is how it rots."
              printf '%s\n' "- :tada: \`${nodeid}\` no longer fails — delete its line from the expected-failure list in \`.github/workflows/checks.yml\`." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done < expected-failures.txt

          if [ -n "$unexpected" ]; then
            {
              echo "### Backend tests: unexpected failures"
              echo ""
              echo "Not on the known-failure list in \`.github/workflows/checks.yml\`:"
              echo ""
              printf '%s\n' "$unexpected" | sed 's/^/- `/; s/$/`/'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            printf '%s\n' "$unexpected" | while IFS= read -r nodeid; do
              echo "::error::${nodeid} failed, and it is not on the expected-failure list (which is empty). That is a regression, not the baseline."
            done
            exit 1
          fi

          # Every failure was licensed by name. pytest's own non-zero status is deliberately NOT
          # propagated here — translating it is the entire job of the list above, and the two
          # branches before this one (the floor, and the unexpected-failure check) are what make
          # doing so safe rather than a dressed-up `|| true`.
          if [ "$status" -ne 0 ]; then
            echo "Only failures on the expected-failure list fired; the comment on this step says what each one is and how to fix it."
          fi
          exit 0

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 2 · The web checks
  # ═══════════════════════════════════════════════════════════════════════════════════════
  web:
    name: Web typecheck, lint and unit specs
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # `engines.node` in frontend/package.json ("24.x"), the same field deploy-frontend.yml's
          # "Set up Node" step reads to build production and Vercel reads to choose the Node the
          # on-demand pages run on. A typecheck that passes on a different major from the one that
          # builds and runs production is not the check anybody thinks it is, and one field is the
          # only arrangement in which they cannot drift apart. `check-latest` takes the newest 24.x
          # release rather than whichever one the runner image happened to cache.
          node-version-file: frontend/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm ci` only. NO `npx playwright install`: MEASURED 2026-09-14 with
        # PLAYWRIGHT_BROWSERS_PATH pointed at an empty directory, `npm run test:unit` is 104 passed
        # in 1.7 s. Not one of the eight `*-unit.spec.ts` files asks for the `page` fixture (checked:
        # zero matches for `page.goto`, `page.route` or a `{ page }` parameter across all eight), and
        # Playwright launches a browser lazily, so it is never asked to. Downloading Chromium would
        # add about a minute to every run of this job to serve nothing. If a spec ever does need one,
        # the failure says exactly that ("Executable doesn't exist… run npx playwright install"),
        # which is a better signpost than a browser sitting there letting a screen-driving spec time
        # out against a server that is not running.
        #
        # `npm ci` and not `npm install`, so the lockfile decides what is installed rather than the
        # index. Verified in sync on the way in: `npm ci --dry-run` from frontend/ exits 0.
        run: npm ci

      - name: Typecheck
        # `next build` also fails on a type error, but only during the deploy — i.e. AFTER the backend
        # has already shipped and the live site is pointed at it (docs/CI.md §1 explains why the
        # backend goes first). Running it here moves the answer to before the merge. Measured
        # 2026-09-14 from frontend/: exit 0.
        #
        # `npx tsc --noEmit` rather than `npm run typecheck`, which is literally the same command
        # (frontend/package.json:10): this way the log of the step says what the step ran.
        run: npx tsc --noEmit

      - name: Lint
        # `npm run lint` — the repository's own script (frontend/package.json:9), deliberately,
        # rather than a longer invocation typed into this file. If CI runs a stricter command than
        # the one a contributor runs locally, the contributor's green is a lie and they find out here,
        # which is the wrong place to find out.
        #
        # ON `--max-warnings=0`, WHICH IS NOT HERE AND ARGUABLY SHOULD BE: measured 2026-09-14, this
        # tree is already clean under it — `npx eslint . --max-warnings=0` from frontend/ exits 0 —
        # so adopting it would cost nothing today and would stop the slow accumulation of warnings
        # nobody fails on, which are exactly the accessibility and hook findings worth reading. IT
        # BELONGS IN package.json's `lint` SCRIPT, not on this line, for the reason in the paragraph
        # above: one command, one answer, everywhere.
        #
        # (This step prints one line from jsx-ast-utils about a JSXEmptyExpression prop it could not
        # resolve. That is the plugin talking about itself, not a finding; eslint exits 0.)
        run: npm run lint

      - name: Unit specs
        # ONLY the specs that need no dev server and no database. The rest of frontend/e2e/ signs in
        # against a real API and drives real records — frontend/playwright.config.ts says so in its
        # header and deliberately starts no server of its own — and standing that up on a runner is a
        # much larger job and a separate decision. docs/CI.md §5 keeps it on the list rather than
        # pretending it is done.
        #
        # The selection lives in frontend/package.json:12 (`playwright test ".*-unit\.spec\.ts"`), and
        # package.json cannot hold a comment, so the rule is written here: the `-unit` suffix is this
        # repository's convention for a spec that exercises a pure function rather than a screen.
        # ALL EIGHT FILES CARRYING THE SUFFIX HONOUR IT TODAY — unlike the sibling repository, which
        # has to exclude two of its own by name — so there is no exclusion list here, and the
        # measurement above (104 passed with no browser binaries anywhere on disk) is the proof that
        # there is nothing to exclude.
        #
        # WHAT DECIDES WHETHER A NEW FAILURE MEANS "this spec is misnamed": a failure inside
        # `page.goto` — connection refused, or a navigation timeout where something answers :3000 but
        # does not serve — means the spec wants a dev server and does not belong in this pattern. A
        # failing `expect(source).toContain(…)` does NOT: those are source-inspection assertions about
        # a symbol a component is supposed to have, no dev server would change the answer, and
        # excluding one would be silencing the check rather than scoping it.
        run: npm run test:unit

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # 3 · The documentation check
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # ─── THE DECISION THIS JOB IS, AND THE ARGUMENT FOR IT ───────────────────────────────────
  # `node docs/tools/check-docs.mjs` REPORTS FOUR PROBLEMS ON THE TREE THIS JOB LANDED WITH, and
  # exits 1. There were two honest options: fix the four first and gate hard, or run it and be
  # precise about which failures are licensed. This job does the second, and here is the argument.
  #
  # NOT ONE OF THE FOUR IS THIS WORKSTREAM'S TO FIX, and that is not an excuse, it is the whole point
  # — a gate whose green depends on edits to four documents owned by other people arrives red, stays
  # red through no fault of the pull requests it blocks, and is switched off within the week. This
  # repository already has that failure mode written down in its own history: android-build.yml:125-139
  # carries `continue-on-error: true` on Android Lint with the honest reason beside it, that one
  # pre-existing manifest error means a hard gate "would fail 100% of runs from day one and train
  # everyone to ignore red".
  #
  # WHAT THIS DOES BETTER THAN THAT PRECEDENT, because `continue-on-error` is not good enough: a
  # `continue-on-error` cannot shrink, it licenses EVERY failure including the ones nobody has seen
  # yet, and nothing ever tells you it could be removed. The gate below names the four, one line
  # each, and fails on anything else. It is a ratchet that can only turn down: fix a document, delete
  # a line, and that problem can never come back silently. Nobody can add a fifth without editing
  # this file in a diff somebody reviews.
  #
  # SO THIS IS NOT `|| true`, AND THE DIFFERENCE IS THE POINT. `|| true` licenses the failures you
  # have not seen yet. A named list licenses the four you have, and only while they are exactly those
  # four.
  #
  # THE RATCHET IS AT ZERO, AND THE EMPTY LIST BELOW IS THE POINT RATHER THAN AN OVERSIGHT. All four
  # problems this job was born licensing were fixed on 2026-09-14 and their lines deleted, in the
  # order the recommendation asked for: REPO_FACTS.md regenerated (`node docs/tools/check-docs.mjs
  # --write` — it had been claiming 14 backend test files and 260 cases against a real 56 files and
  # 832 `def test_`; no Android tests against eight files; and that neither suite gated CI, which
  # this workflow had already made false); "How this document is kept true" sections for
  # DATASET_API.md and DESIGN-claude.md; and docs/README.md's link to `../DESIGN-claude.md`
  # repointed after that file moved into docs/ — which also turned up the fact that DATASET_API.md
  # had never been in the documentation index at all.
  #
  # SO THE GATE IS NOW A REAL ONE: with nothing licensed, the first FAIL line of any kind fails this
  # job. KEEP IT THAT WAY. Adding a line back is not forbidden, but it is the thing to argue about in
  # review — it licenses a problem for everybody, and the nine warnings this run still prints are
  # already the cheaper mechanism for a document somebody else owns (check-docs.mjs's own
  # OWNED_ELSEWHERE set, docs/tools/check-docs.mjs:43-52).
  docs:
    name: Docs check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        # Full history is NOT needed, but a real git checkout is: check-docs shells out to
        # `git ls-files` to decide which paths a document is allowed to name.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The web app's major (frontend/package.json `engines.node`), so the repository runs one
          # Node and not two; the script itself needs nothing newer than node: builtins.
          node-version-file: frontend/package.json
          check-latest: true

      - name: Verify the documentation set
        # No `npm ci` anywhere: the script imports nothing outside node: builtins (child_process, fs,
        # path, url), deliberately, so it runs from a bare checkout. Nothing in package.json is needed
        # and installing it would only make this job slower.
        #
        # MEASURED 2026-09-14 from the repository root, AFTER the four licensed problems were fixed:
        # 463 repository paths resolved, 59 line citations checked, 175 relative links resolved, 46
        # mermaid blocks linted, then `docs check passed (9 warning(s) in documents owned
        # elsewhere).` and exit 0. THE EXIT 0 IS THE FACT; none of those counts are — the same
        # command an hour earlier gave 413 paths, 48 citations, 163 links and 45 mermaid blocks,
        # because other workstreams keep adding documents. That is why the floor below is 200 and not
        # "the number measured today". The nine warnings are findings in documents the script itself
        # knows belong to another workstream (its own OWNED_ELSEWHERE list,
        # docs/tools/check-docs.mjs:43-52); they are reported and do not affect its exit code, so
        # they are not this gate's business either.
        #
        # WHEN THIS GOES RED, the usual cause is not prose at all — it is
        # `docs/REPO_FACTS.md is out of date`, because that file is GENERATED from the repository
        # (model counts, endpoint counts, per-surface test counts) and any change to a route, a Prisma
        # model or the number of test files moves it. The fix is one command, and it produces a
        # reviewable diff rather than a number somebody retyped:
        #     node docs/tools/check-docs.mjs --write
        run: |
          set -uo pipefail

          # Substrings, not whole lines: each names one problem tightly enough that no other line can
          # match it, and loosely enough that the em dash and the exact wording after it can change
          # without this list quietly licensing something else. ASCII only, deliberately — a fixed
          # string with a typographic dash in it is a gate that depends on the runner's locale.
          cat > known-doc-problems.txt <<'LIST'
          LIST

          # `2>&1` IS LOAD-BEARING AND WAS FOUND THE HARD WAY. check-docs.mjs:548 prints its FAIL
          # lines with `console.error`, i.e. to STDERR, while every `ok`/`warn` line and the closing
          # tally go to stdout. Without the redirect this log holds the tally and none of the
          # failures, `doc-problems.txt` comes out EMPTY, and the gate below would have licensed
          # everything by finding nothing to object to. Measured on the first local run of this exact
          # block: four problems on screen, zero in the file.
          status=0
          if ! node docs/tools/check-docs.mjs 2>&1 | tee docs-check.log; then
            status=1
          fi

          # ⚠ `|| rc=$?` RATHER THAN A BARE CALL, AND THE `rc=$?` ON THE NEXT LINE IS NOT ENOUGH.
          # GitHub runs a `run:` block as `bash -e {0}`, and this script sets `-uo pipefail` without
          # ever clearing `-e`. A grep that matches NOTHING exits 1, so under `-e` the step dies
          # right here — before `rc` is read, before the comparison below, and with none of this
          # script's own `::error::` lines printed. Putting the grep in a `||` list is what exempts
          # it from `-e` while keeping the author's rc idiom intact.
          #
          # THIS WAS INVISIBLE FOR AS LONG AS THE DOCS WERE BROKEN. While the four licensed problems
          # existed there were always FAIL lines to match, so this grep always exited 0. The first
          # run in which the documentation was actually clean is the run that failed — a gate that
          # could report a problem but could not report success. Found on 2026-09-14, the run after
          # the known-problem list reached zero.
          rc=0
          grep -E '^FAIL' docs-check.log > doc-problems.txt || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not read the docs-check output (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          # ── THE CHECK MUST HAVE CHECKED SOMETHING ────────────────────────────────────
          # check-docs exits 0 just as cheerfully over a docs/ directory it failed to read as over a
          # clean one. Between 413 and 441 paths were resolved on the day this landed — the number
          # moves whenever anybody adds a document — so this is a FLOOR, not a target: 200 survives
          # ordinary deletion and still catches a run that inspected nothing.
          paths=$(sed -nE 's/.*[^0-9]([0-9]+) repository paths resolved.*/\1/p' docs-check.log | tail -n 1)
          echo "check-docs resolved ${paths:-0} repository paths"
          if [ "${paths:-0}" -lt 200 ]; then
            echo "::error::check-docs resolved only ${paths:-0} repository paths, far below the 400-odd measured when this job landed. It did not inspect the documentation set, so a green tick here would be meaningless."
            exit 1
          fi

          # A non-zero exit with no FAIL line at all means the script itself broke — a syntax error,
          # a missing git, an unhandled exception. That must never be read as "no problems found".
          if [ "$status" -ne 0 ] && [ ! -s doc-problems.txt ]; then
            echo "::error::check-docs exited non-zero without printing a single FAIL line, so it crashed rather than found problems. Read the log above."
            exit 1
          fi

          # Same `-e` trap, and this one bites on the HAPPY path specifically: "no unexpected
          # problems" is grep finding nothing, which is exit 1. An empty known-problem list is also
          # an empty PATTERN file — `grep -f` with no patterns matches nothing, so `-v` matches every
          # line, which is the correct reading of an empty licence: every problem is unexpected.
          rc=0
          unexpected=""
          unexpected=$(grep -vFf known-doc-problems.txt doc-problems.txt) || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::could not compare the known-problem list against this run (grep exited $rc). Failing rather than guessing."
            exit 1
          fi

          # A known problem that stopped being reported is the ratchet turning. Loud, and not fatal.
          while IFS= read -r known; do
            [ -n "$known" ] || continue
            if ! grep -qF "$known" doc-problems.txt; then
              echo "::warning::the documentation problem '${known}' is fixed. Delete its line from known-doc-problems.txt in .github/workflows/checks.yml — that list may only shrink."
              printf '%s\n' "- :tada: fixed: \`${known}\` — delete its line from the known-problem list in \`.github/workflows/checks.yml\`." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done < known-doc-problems.txt

          if [ -n "$unexpected" ]; then
            {
              echo "### Docs check: new problems"
              echo ""
              echo "Not on the known-problem list in \`.github/workflows/checks.yml\`:"
              echo ""
              printf '%s\n' "$unexpected" | sed 's/^/- /'
              echo ""
              echo "If one of them is \`docs/REPO_FACTS.md is out of date\`, run \`node docs/tools/check-docs.mjs --write\` and commit the result."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::check-docs reported a documentation problem that is not on the known-problem list — which is currently EMPTY, so this is simply a new problem. See the run summary; fix it, or argue for it in review before adding it to the list in this workflow."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Only the known pre-existing documentation problems were reported; the comment on this job says what each one is and who fixes it."
          fi
          exit 0
