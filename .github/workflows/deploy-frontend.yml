name: Deploy frontend to Vercel

# Stage 2 of 3:  deploy-backend.yml → [ THIS ] → android-build.yml
#
# ─── WHY THIS RUNS AFTER THE BACKEND, AND NEVER BEFORE ────────────────────────────────
# The web app is a pure client: the browser talks straight to the FastAPI box (there is no
# Next.js proxy — see docs/DEPLOYMENT_VERCEL.md §0), so the bundle we publish here assumes
# every endpoint it calls already exists. A commit that adds a page and the API route it
# reads is a single push; if the Vercel deploy wins the race, the live site spends the next
# few minutes calling routes that answer 404 — users see empty lists, failed saves, and
# "Failed to fetch" toasts, and it self-heals only when the EC2 deploy catches up. Worse,
# the backend deploy stops the service to run `prisma migrate deploy`, so the gap is not
# theoretical: there is a real window where the API is down. Backend first, always.
#
# The gate is `workflow_run` on the backend workflow *completing successfully*. Note that
# the backend workflow deliberately has no `paths:` filter (see its header): it starts on
# every push to main and skips its own deploy job when backend/ is untouched. That is what
# stops a frontend-only change from dead-locking here waiting for a run that never starts.
#
# ─── ONE-TIME SETUP THIS WORKFLOW ASSUMES ─────────────────────────────────────────────
# Vercel's own Git integration must NOT also be auto-deploying `main`, or it will race
# ahead of the backend and re-create exactly the bug this ordering exists to prevent.
# Turn it off once, in Vercel → Project → Settings → Git → "Ignored Build Step"
# (`exit 0`) or by disabling production deployments for `main`. docs/CI.md has the exact
# steps. Preview deployments for pull requests can stay on — they are not the live site.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens → Create (scope: the team)
#   VERCEL_ORG_ID      team_pcTf4Alb2DCIwq2IZcdu00dS
#   VERCEL_PROJECT_ID  prj_EzXN8hhGKpMciFBrZRdxpcgUUzN0
# The NEXT_PUBLIC_* build-time variables are NOT GitHub secrets: `vercel pull` fetches them
# from the Vercel project, so the Environment Variables screen stays the single source of
# truth for them (docs/DEPLOYMENT_VERCEL.md §2). They must be stored there as **Encrypted**,
# never **Sensitive** — Vercel deliberately never hands a sensitive value back to `vercel
# pull`, and since this pipeline builds on the runner rather than on Vercel, a sensitive
# NEXT_PUBLIC_* is an empty one. The two steps that enforce that carry the full story.

on:
  workflow_run:
    workflows: ["Deploy backend to EC2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if no frontend/ files changed"
        type: boolean
        default: true

permissions:
  contents: read
  # actions: read is what lets this run download the change-detection artifact that the
  # backend run produced. Artifacts are the only channel across a workflow_run boundary —
  # job outputs do not cross it.
  actions: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # This job always runs — the ordering rule is enforced by the `should_deploy` output it
  # produces, not by an `if:` on the job itself. Two reasons for that shape:
  #   1. A run whose only job was skipped is a confusing "grey tick" with no explanation of
  #      why the site did not update; here the reason is printed in the job summary.
  #   2. android-build.yml is chained off THIS workflow completing. A workflow run in which
  #      every job was skipped is a weaker signal to chain from than one that really ran,
  #      so keeping a job alive keeps stage 3 reliably reachable even on a failed backend
  #      deploy — which is exactly when you still want to know the APK compiles.
  # It does NOT fail when the backend deploy failed: the backend workflow is already red,
  # and a second red X for the same root cause is noise, not information.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Fetch the change summary from the backend run
        id: fetch
        # Skipped when the backend deploy did not succeed — there is nothing to deploy in
        # that case, and the artifact may not even have been uploaded.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        continue-on-error: true # absent on manual dispatch, and on any older backend run
        uses: actions/download-artifact@v4
        with:
          name: pipeline-changes
          path: pipeline-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Presence only — the value never enters the log. `secrets` is not readable from
          # an `if:` on a step in a reusable position, so the check happens here in the gate.
          HAVE_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # ── The ordering rule, enforced ──────────────────────────────────────────────
          # Anything other than a green backend run stops the deploy dead. A cancelled or
          # failed backend deploy can leave the API stopped mid-migration, so publishing a
          # frontend that depends on it would be strictly worse than publishing nothing.
          if [ "$EVENT" != "workflow_dispatch" ] && [ "${BACKEND_CONCLUSION}" != "success" ]; then
            echo "Backend deploy concluded '${BACKEND_CONCLUSION}' — refusing to publish the frontend."
            {
              echo "### Frontend deploy skipped"
              echo ""
              echo "The backend workflow concluded \`${BACKEND_CONCLUSION}\`. The web app calls"
              echo "endpoints that may not exist (or may be down mid-migration) until that deploy"
              echo "is green. Fix the backend deploy and re-run it; this workflow will follow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Not configured yet is a skip, not a failure ──────────────────────────────
          # Until VERCEL_TOKEN exists the Vercel CLI cannot authenticate, and letting the
          # deploy job start anyway paints the whole pipeline red for a setup step nobody
          # has done yet — which trains people to ignore a red X on the release pipeline.
          # Skip with the instructions instead, so the backend stage's green tick still
          # means what it says and stage 3 still runs.
          if [ "${HAVE_VERCEL_TOKEN}" != "true" ]; then
            echo "VERCEL_TOKEN is not set — skipping the frontend publish."
            {
              echo "### Frontend deploy skipped — not configured"
              echo ""
              echo "This repository has no \`VERCEL_TOKEN\` secret, so there is nothing to"
              echo "authenticate the publish with. Add these three under **Settings →"
              echo "Secrets and variables → Actions**, then re-run this workflow:"
              echo ""
              echo "| Secret | Where to get it |"
              echo "| --- | --- |"
              echo "| \`VERCEL_TOKEN\` | Vercel → Account Settings → Tokens → Create |"
              echo "| \`VERCEL_ORG_ID\` | \`.vercel/project.json\` → \`orgId\` |"
              echo "| \`VERCEL_PROJECT_ID\` | \`.vercel/project.json\` → \`projectId\` |"
              echo ""
              echo "Also turn Vercel's own Git auto-deploy for \`main\` off first, or it"
              echo "will publish ahead of the backend — see \`docs/CI.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Default to deploying. A missing or unreadable summary must never silently skip
          # a real change — over-deploying costs a build minute, under-deploying ships a
          # stale site that nobody notices until a user reports it.
          should=true
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Manual dispatch with force=true."
          elif [ -f pipeline-changes/changes.env ]; then
            cat pipeline-changes/changes.env
            # Grepped, not sourced: only an exact `frontend=false` line can turn a deploy
            # off, so a malformed or truncated artifact falls through to "deploy".
            if grep -qx 'frontend=false' pipeline-changes/changes.env; then
              should=false
              echo "No frontend/ files changed in this push — nothing to publish."
            fi
          else
            echo "No change summary available; deploying to be safe."
          fi
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $sha: should_deploy=$should" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://field-repository.vercel.app
    env:
      # The CLI reads these two to resolve the project without a committed .vercel/ link
      # (frontend/.vercel is gitignored, so CI has no link to inherit).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout the commit the backend deployed
        uses: actions/checkout@v4
        with:
          # A workflow_run run defaults to the tip of the default branch, which may already
          # have moved on. Pin to the exact commit whose backend deploy just went green so
          # the API and the site that calls it come from the same tree.
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Next 16 needs ≥ 20.9; 22 matches Vercel's current build image
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Vercel CLI
        # Unpinned on purpose so token/API changes never strand the pipeline. If a CLI
        # release ever breaks the build, pin the version here — see docs/CI.md.
        run: npm install --global vercel@latest

      # Every CLI command below runs from the REPOSITORY ROOT, not from frontend/. The
      # Vercel project stores Root Directory = frontend (docs/DEPLOYMENT_VERCEL.md §1) and
      # `vercel build` applies that setting itself; running from inside frontend/ would
      # make it look for frontend/frontend and fail with "No Next.js version detected".
      - name: Pull the production project settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Assert the project is still rooted at frontend/
        # Cheap guard against the single most common way this workflow can break: someone
        # clears Root Directory in the dashboard and the build starts looking at the repo
        # root, where there is no package.json. Fail here with a readable message instead
        # of 60 lines into a Next.js build.
        run: |
          set -euo pipefail
          root="$(node -p "require('./.vercel/project.json').settings?.rootDirectory ?? ''")"
          echo "Vercel Root Directory = '${root}'"
          if [ "$root" != "frontend" ]; then
            echo "::error::Vercel project Root Directory is '${root}', expected 'frontend'."
            echo "::error::Fix it in Vercel → Project → Settings → General → Root Directory."
            exit 1
          fi

      - name: Assert the pulled environment carries the values the app cannot run without
        # 2026-07-26: these variables were marked Sensitive in the dashboard. Vercel never
        # returns a sensitive value to `vercel pull`, and this pipeline builds on the runner
        # (`vercel build` below, then `deploy --prebuilt`) rather than on Vercel — so the
        # build had nothing to inline, Next.js compiled in `undefined`, and every stage of
        # the pipeline went green over a site that could not log a single person in. Failing
        # here is the only place that costs nothing; the alternative is finding out from a
        # user. Presence and shape only — see the note about values in the loop.
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::vercel pull wrote no ${env_file}, so the build has no NEXT_PUBLIC_* values at all."
            exit 1
          fi

          fail=0
          for var in NEXT_PUBLIC_API_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
            # Never echoed. These two are public by definition (they are compiled into the
            # JavaScript every visitor downloads), but a workflow that prints env values is
            # the template someone copies the day the variable is not public.
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"

            if [ -z "$value" ] || [ "$value" = "undefined" ]; then
              echo "::error::${var} is missing or empty in the pulled production environment."
              echo "::error::Almost always this means it is stored as Sensitive in Vercel. A Sensitive variable is withheld from 'vercel pull' by design, this pipeline builds on the GitHub runner, and Next.js therefore inlines undefined - the build and the deploy both still succeed and the live site is broken."
              echo "::error::Fix: Vercel -> Project -> Settings -> Environment Variables, delete ${var} and re-add it as Encrypted (not Sensitive) for Production, Preview and Development, then re-run this workflow."
              fail=1
              continue
            fi

            case "$var" in
              NEXT_PUBLIC_API_URL)
                case "$value" in
                  http://*|https://*) ;;
                  *)
                    echo "::error::${var} is set but is not an absolute http(s) origin. lib/api.ts appends /api to it verbatim, so a bare host or a stray quote breaks every request the browser makes."
                    fail=1
                    continue ;;
                esac ;;
              NEXT_PUBLIC_GOOGLE_CLIENT_ID)
                case "$value" in
                  *.apps.googleusercontent.com) ;;
                  *)
                    echo "::error::${var} is set but does not end in .apps.googleusercontent.com. Google answers anything else with 'Error 401: invalid_client - The OAuth client was not found', which looks like an outage rather than a typo."
                    fail=1
                    continue ;;
                esac ;;
            esac

            echo "${var}: present, ${#value} characters, shape OK"
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Build (uses the project's own install/build commands from frontend/vercel.json)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Assert the values actually reached the bundle we are about to publish
        # The step above checks an *input* to the build; this one checks the artifact. A
        # variable that was pulled fine and still did not get inlined is a different bug
        # with the same symptom — a stale cache, a build that resolved the wrong Root
        # Directory, a `process.env[name]` lookup Next cannot statically replace — and it
        # would sail past every check upstream of here. Grepping .vercel/output for the
        # host is the literal user-visible symptom: when this broke, searching the live
        # chunks for the API origin and the client id returned nothing at all.
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          out=".vercel/output"
          if [ ! -d "$out" ]; then
            echo "::error::vercel build produced no ${out} to inspect."
            exit 1
          fi

          fail=0
          for var in NEXT_PUBLIC_API_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID; do
            value="$(sed -n "s/^${var}=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
            needle="$value"
            if [ "$var" = "NEXT_PUBLIC_API_URL" ]; then
              # Host[:port] only. The bundle may hold the origin split from its scheme or
              # joined to a path, but the host is the part whose absence is fatal.
              needle="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
            fi

            # An empty needle would match every file and report a cheerful false pass, so
            # it has to be its own failure. Reachable via a scheme with no host behind it,
            # which satisfies the shape check before the build.
            if [ -z "$needle" ]; then
              echo "::error::${var} has no value to search for here, so nothing could have been inlined from it."
              fail=1
              continue
            fi

            # -a because the output tree mixes minified JS with binaries; -F because a
            # host is a literal, not a pattern. The needle is searched for, never printed.
            if grep -raqF -- "$needle" "$out"; then
              echo "${var}: found inlined in ${out}"
            else
              echo "::error::${var} was present in the pulled environment but its value appears nowhere in ${out}."
              echo "::error::The bundle cannot use a value it does not contain, so this build would deploy green and fail at runtime. Do not publish it - check that the build resolved Root Directory 'frontend' and that the app reads process.env.${var} as a literal, which is the only form Next.js inlines."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy the prebuilt output to production
        id: deploy
        run: |
          set -euo pipefail
          # --prebuilt uploads .vercel/output instead of rebuilding on Vercel, so what was
          # verified in the step above is byte-for-byte what goes live. --prod moves the
          # production alias (field-repository.vercel.app) onto this deployment.
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check the production alias
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # This proves the alias moved and the site is being served. It proves nothing
          # about whether the site works: the build that shipped `undefined` for all three
          # NEXT_PUBLIC_* values returned 200 on every page it had, and simply could not
          # log anyone in. A 200 only ever rules out "no deployment" — the step after this
          # one is what rules out "a deployment nobody can use", by reading the bytes the
          # CDN is handing out rather than trusting that it has any.
          # Alias propagation is not instant; poll rather than sleep-and-hope.
          for i in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://field-repository.vercel.app/ || true)"
            if [ "$code" = "200" ]; then
              echo "production alias healthy after ${i} tries (HTTP $code)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::field-repository.vercel.app did not return 200 (last: ${code:-none}). Deployment: ${DEPLOY_URL}"
          exit 1

      - name: Assert the bundle the CDN is serving is the one that was verified
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        # The two assertions before the deploy grade an artifact on the runner; this one
        # grades the artifact a visitor receives, which is the only one that has ever been
        # broken. Everything between the two — the upload, `--prod` picking which deployment
        # the alias lands on, the edge cache — is unverified by anything upstream, so a stale
        # alias or a `--prod` that aliased a different deployment reads as a clean green run.
        # Fetching /login and grepping its own chunks for the API host is exactly the check
        # that was run by hand to diagnose 2026-07-26, promoted out of the incident channel.
        run: |
          set -euo pipefail
          site="https://field-repository.vercel.app"
          env_file=".vercel/.env.production.local"

          # Read, never echoed — same rule and same extraction as the pre-build assertions.
          value="$(sed -n "s/^NEXT_PUBLIC_API_URL=//p" "$env_file" | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
          host="$(printf '%s' "$value" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*$##')"
          if [ -z "$host" ]; then
            echo "::error::There is no API host to look for in the live bundle, so this check cannot say anything about it. The pulled production environment should have failed the earlier assertion - do not treat this deployment as verified."
            exit 1
          fi

          work="$(mktemp -d)"
          paths=()
          total=0
          searched=0

          # Six attempts, because a fresh alias takes a few seconds to reach every edge and
          # the first request after a deploy can still be answered by the deployment it just
          # replaced. Failing on the first miss would page someone for CDN propagation.
          for attempt in $(seq 1 6); do
            searched=0
            paths=()
            rm -rf "${work:?}/"* 2>/dev/null || true

            # The query string is a cache-buster: without it the edge is free to hand back
            # the previous deployment's HTML, and this would grade the build just replaced.
            if ! curl -fsS --max-time 30 -o "$work/login.html" "${site}/login?ci-smoke=${GITHUB_RUN_ID}-${attempt}"; then
              echo "attempt ${attempt}: /login did not answer yet"
              sleep 10
              continue
            fi

            # The script tags on the page, resolved against the alias, so what gets read is
            # what a browser would download rather than what the runner still has lying in
            # .vercel/output. Chunk filenames are content-hashed, hence no cache-buster.
            while IFS= read -r path; do
              paths+=("$path")
            done < <(grep -oE '/_next/static/chunks/[A-Za-z0-9._@/-]+\.js' "$work/login.html" | sort -u)
            total="${#paths[@]}"

            if [ "$total" -eq 0 ]; then
              echo "attempt ${attempt}: /login answered but loaded no JavaScript, which is not a page anyone can sign in on"
              sleep 10
              continue
            fi

            found=0
            for path in "${paths[@]}"; do
              # A 404 here means the alias moved between the page and its scripts; the retry
              # picks up a consistent pair instead of counting the miss against the build.
              if ! curl -fsS --max-time 30 -o "$work/chunk.js" "${site}${path}"; then
                continue
              fi
              searched=$((searched + 1))
              if grep -aqF -- "$host" "$work/chunk.js"; then
                found=1
                break
              fi
            done

            if [ "$found" -eq 1 ]; then
              echo "live bundle calls the expected API host (attempt ${attempt}, found in chunk ${searched} of ${total})"
              exit 0
            fi

            echo "attempt ${attempt}: read ${searched} of ${total} chunks, none mentions the API host"
            sleep 10
          done

          # Two unrelated failures end up here, and saying which one it was matters: nothing
          # to read means the site is down, which anyone can see; chunks without the host is
          # the one that looks perfectly healthy and cannot sign a single person in.
          if [ "$searched" -eq 0 ]; then
            echo "::error::Nothing readable came back from ${site}/login on any of 6 attempts - either the page never answered or it loaded no JavaScript at all - so there is no evidence this deployment works."
          else
            echo "::error::The live site is serving a login page whose JavaScript never mentions the API host from NEXT_PUBLIC_API_URL (${#host} characters, taken from the environment this build was pulled with). Searched ${searched} of the ${total} chunks that ${site}/login loads, on each of 6 attempts."
            echo "::error::The upload was checked and did contain that host, so the bytes on the alias are not the bytes that were built - either the production alias is still pointing at an older deployment, or --prod aliased a different one. Whichever it is, the site is in the state it was in on 2026-07-26: every page loads, and nobody can sign in."
          fi
          echo "::error::This deployment is ALREADY live, so fix the site before fixing the cause. Roll back first: Vercel -> Project -> Deployments -> the last deployment known to work -> Instant Rollback (or 'vercel rollback <that deployment url>'). Then re-run this workflow to publish ${DEPLOY_URL} again and watch this step."
          exit 1
