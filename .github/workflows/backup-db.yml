name: Nightly database backup

# ─── WHY THIS FILE EXISTS, AND WHY ITS ABSENCE WAS THE WORST GAP IN THIS REPOSITORY ───────
#
# Until 2026-09-13 NOTHING ANYWHERE TOOK A COPY OF THIS DATABASE. Not a cron, not a script, not
# a manual runbook step. The sibling product had this workflow from 2026-09-03
# (designer-portal/.github/workflows/backup-db.yml); this repository — the one holding the
# ARTISAN records, the 284-question interview instrument and every field sitting recorded
# against it — had nothing, and the gap was invisible because the EC2 box is stateless on
# purpose (infra/terraform/main.tf) and rebuilding it restores the API in minutes. It restores
# no data at all. A dropped table, a bad migration, a deleted project on Supabase's side or an
# account lockout was unrecoverable and permanently so.
#
# Supabase's own point-in-time recovery is a paid add-on this project does not carry
# (`selected_addons: []`, checked 2026-09-13) and would not be a substitute anyway: it is a copy
# held by the same vendor whose failure it is meant to survive. This workflow puts a plain,
# portable `pg_dump` in S3, outside the database provider, on a schedule, and FAILS LOUDLY when it
# does not. Restoring from it needs nothing but `psql`.
#
# WHERE THAT IS, PRECISELY (corrected 2026-10-17; this said "a different account boundary", which
# was never true). The dump lands in this portal's own media bucket, in the SAME AWS account
# (626159998512) and region (ap-south-1) as production media. Since 2026-10-17 that bucket is
# versioned and replicates to `fieldrepo-offsite-626159998512` in ap-south-2 (Hyderabad), where
# Object Lock keeps every version for at least 35 days. So a dump survives a Supabase failure, an
# overwrite, a deletion and a regional outage. It does not survive the loss of the AWS account.
# infra/terraform/backups.tf declares all of it.
#
# ─── WHEN IT RUNS: 21:47 UTC, PLUS A FRESHNESS CHECK AT 09:53 UTC (changed 2026-10-18) ──
# It was 03:30 UTC. GitHub starts scheduled jobs late under load, worst on the hour: from 3 to 17
# October 2026 that run started between 07:57 and 11:12 UTC (13:27-16:42 IST), in the field working
# day (restore drill gap 6). 21:47 UTC is 03:17 IST: a delay of the same size still lands the dump
# before the field day, and an odd minute stays out of the top-of-the-hour queue.
#
# It stays clear of 20:00, when keep-supabase-active.yml pings the database: two scheduled workflows
# opening session-mode connections to the same pooler at the same minute is how a backup starts
# failing with EMAXCONNSESSION and gets read as a database fault. The sibling repository runs at
# 21:17, 30 minutes earlier, so the two Supabase projects in one organisation are never dumped at
# the same minute.
#
# A late or missing run used to pass in silence. The `freshness` job below runs on its own
# schedule and fails if the newest nightly dump is over 26 hours old or the newest weekly copy over
# 8 days old. GitHub e-mails a failed scheduled run to whoever last changed the schedule. Run it by
# hand with Run workflow → task: freshness-check.
#
# ─── THE SECRETS ──────────────────────────────────────────────────────────────────────────
#   DATABASE_URL                the session-pooler DSN (port 5432, NOT the transaction pooler on
#                               6543). pg_dump holds one connection open across the whole dump and
#                               sets session state; the transaction pooler multiplexes statements
#                               across backends and will corrupt or refuse the dump.
#   AWS_BACKUP_ACCESS_KEY_ID     ─┐ The `fieldrepo-backup-writer` user (`aws_iam_user.backup_writer`
#   AWS_BACKUP_SECRET_ACCESS_KEY ─┘ in infra/terraform/backups.tf), used by this workflow and by
#                               nothing else. It may `PutObject` under
#                               `backups/documentation-portal/` and `ListBucket` under that
#                               prefix. It cannot read a dump, delete one, or touch `media/`. Its
#                               key is backed up in SSM at /iit/documentation-portal/backup-writer-*.
#
#                               UNTIL 2026-10-17 THIS JOB RAN UNDER A SECOND KEY OF THE API'S OWN
#                               USER, `fieldrepo-media` (`AWS_MEDIA_*`), whose first key sits on
#                               the internet-facing box. That identity could overwrite any dump.
#                               It now has no grant on `backups/` at all, the bucket policy denies
#                               it there explicitly, and the second key was deactivated.
#
# ─── WHERE THE DUMPS GO, AND WHAT ACTUALLY KEEPS THEM PRIVATE ─────────────────────────────
# s3://fieldrepo-media-626159998512/backups/documentation-portal/YYYY-MM-DD.sql.gz
#
# TWO POLICIES DECIDE THIS, NOT ONE:
#
#   1. `aws_s3_bucket_policy.media_public_read` grants anonymous s3:GetObject on `media/*` and
#      nothing else, so an object under `backups/` is not public even though this bucket holds
#      public objects. Do not move these under `media/`, and do not widen that policy to `*`: a
#      full database dump answering an anonymous GET is the worst object this account could hold.
#   2. The IAM policies. The API's key (`aws_iam_user_policy.media`) is confined to `media/*` and
#      the bucket policy denies it `backups/*` and `tfstate/*`. This job's key
#      (`aws_iam_user_policy.backup_writer`) can add a dump and list `backups/documentation-portal/`,
#      so the proof step below can measure an object it cannot read.
#
# The prefix is the SHAPE of the boundary; those two policies ARE the boundary. A third prefix in
# this bucket is a change to both of them, not a change to a path string.
#
# RETENTION IS NOT SET HERE, AND CANNOT BE. A workflow can write an object; it cannot express
# "expire it in thirty days" without holding a delete right, and this job holds none anywhere in
# the account — deliberately. Expiry belongs to the bucket and is declared in
# infra/terraform/main.tf as an `aws_s3_bucket_lifecycle_configuration` scoped to the dated
# nightly keys under `backups/` (30 days). With versioning on, an expired or overwritten dump stays as a noncurrent
# version for 90 more days, and the Hyderabad copy keeps its own 35-day expiry. If that rule
# is ever removed this job keeps working and the bucket grows forever — a cost problem, not a
# data-loss one, which is the right way round.
#
# ONE DUMP A WEEK IS KEPT FOR A YEAR (2026-10-18, drill gap 4). The first run of each ISO week also
# uploads the dump as `weekly/YYYY-Www_YYYY-MM-DD.sql.gz` under the same prefix. The bucket keeps
# those 365 days (`keep-weekly-dumps`, Hyderabad too); the 30-day rule names only the dated nightly
# keys (`<prefix>/20…`), because with two overlapping expiries S3 applies the shorter.
#
# ─── NO `|| true` ANYWHERE IN THIS FILE, DELIBERATELY ─────────────────────────────────────
# A backup job that swallows its own errors is worse than no backup job: it manufactures a green
# tick that a future incident will be planned around. Every step fails the run. The final step
# re-reads the uploaded object's size FROM S3 rather than trusting the exit code of the upload,
# because the failure this closes is not "the copy errored" but "the copy succeeded and wrote
# nothing" — a `pg_dump` that authenticated against an EMPTY database still exits 0 and still
# gzips to a few hundred bytes.

on:
  schedule:
    - cron: "47 21 * * *"   # the dump
    - cron: "53 9 * * *"    # the freshness check
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [backup, freshness-check]
        default: backup

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump to S3
    if: github.event.schedule == '47 21 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'freshness-check')
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    concurrency:
      # Never two dumps at once. Each holds a session-mode connection for the length of the dump, and
      # the second would fight the running app for the pooler's remaining client slots.
      group: backup-db
      cancel-in-progress: false

    env:
      AWS_DEFAULT_REGION: ap-south-1
      BACKUP_BUCKET: fieldrepo-media-626159998512
      BACKUP_PREFIX: backups/documentation-portal

    steps:
      # NO CHECKOUT. Nothing in this job reads the repository, and a checkout on a job holding the
      # production DSN is one more thing that can go wrong for no benefit.

      - name: Install PostgreSQL client 17 from PGDG
        # THE MAJOR VERSION IS A HARD REQUIREMENT, NOT A PREFERENCE. pg_dump refuses to dump a
        # server newer than itself ("server version 17.x; pg_dump version 16.x" — it errors, it
        # does not degrade), this project's Supabase instance reported 17.6.1 on 2026-09-13 and
        # 17.11 after the owner's upgrade of 2026-10-09 (`supabase projects list`: 17.11.0.003),
        # and the runner image ships whatever client it was built with — PostgreSQL 18.6 on the
        # ubuntu-26.04 image this job names since 2026-10-09. Pinning the client to 17 means the
        # runner image can move under us without silently ending the backups. This step's own text
        # was run on ubuntu:26.04 that day: resolute-pgdg serves postgresql-client-17, and the
        # binary below reported pg_dump 17.11. If the managed database is upgraded past 17, this
        # number moves with it.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # THE PATH `pg_dump` IS NOT THE ONE WE INSTALLED, AND THAT IS THE IMAGE'S DESIGN, NOT A
          # FAULT. Debian's postgresql-client-common serves /usr/bin/pg_dump through pg_wrapper,
          # which prefers the CLUSTER's version — and on a runner with no cluster it answers with
          # the image's own client, whatever newer majors are installed beside it. The sibling
          # repository learned this on its first live run (2026-09-03: the guard below fired with
          # "major 16"). So address the versioned binary DIRECTLY and never trust PATH: the PGDG
          # package always lands it at /usr/lib/postgresql/17/bin/pg_dump.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          echo "PG_DUMP=${PG_DUMP}" >> "$GITHUB_ENV"
          "$PG_DUMP" --version
          # Assert the major we actually got — from the binary we will actually run. If the PGDG
          # layout ever moves, this is where the job says so, before any connection is opened.
          major="$("$PG_DUMP" --version | sed -E 's/.* ([0-9]+).*/\1/')"
          if [ "${major:-0}" -lt 17 ]; then
            echo "::error::${PG_DUMP} is major ${major}, but the managed database needs a client >= 17."
            exit 1
          fi

      - name: Dump the public schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::the DATABASE_URL secret is not set on this repository. This job cannot back up a database it cannot name — create it (session-pooler DSN, port 5432) in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # The INDIA date, not the UTC one: the run is scheduled for 21:17/21:47 UTC (02:47/03:17
          # IST) and GitHub may start it hours late, often past midnight UTC. In IST every start
          # time falls on the same day, so each night gets exactly one key.
          stamp="$(TZ=Asia/Kolkata date +%F)"
          echo "stamp=${stamp}" >> "$GITHUB_ENV"
          # --no-owner / --no-privileges: the dump has to be restorable into a DIFFERENT database
          # whose roles do not exist — which is exactly the database a restore is performed onto,
          # and exactly the database a REGION MIGRATION is performed onto. With ownership and
          # grants in it, every `ALTER TABLE … OWNER TO` fails against a fresh instance.
          # --schema=public because that is the whole application schema; Supabase's own `auth`,
          # `storage`, `realtime` and `extensions` schemas belong to the platform, are not ours to
          # restore, and dumping them produces errors a reader has to learn to ignore.
          #
          # `set -o pipefail` above is load-bearing: without it the exit status of this line is
          # gzip's, and gzip is perfectly happy to compress a failed dump's partial output.
          "$PG_DUMP" "$DATABASE_URL" --no-owner --no-privileges --schema=public \
            | gzip -9 > "backup-${stamp}.sql.gz"
          ls -l "backup-${stamp}.sql.gz"
          # A local floor before spending an upload on it. 100 KB is far below a real dump of this
          # schema and far above an empty one — an authenticated connection to the WRONG (empty)
          # database gzips to about a kilobyte of DDL and would otherwise upload happily.
          bytes="$(stat -c %s "backup-${stamp}.sql.gz")"
          if [ "${bytes}" -lt 102400 ]; then
            echo "::error::the dump is only ${bytes} bytes. That is an empty or failed dump, not a backup of this repository's data. Check that DATABASE_URL names the production database and not a fresh one."
            exit 1
          fi

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::AWS_BACKUP_ACCESS_KEY_ID / AWS_BACKUP_SECRET_ACCESS_KEY are not set. They are the fieldrepo-backup-writer user's keys, NOT the deploy keys; SSM holds a copy at /iit/documentation-portal/backup-writer-*."
            exit 1
          fi
          aws s3 cp "backup-${stamp}.sql.gz" \
            "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${stamp}.sql.gz" \
            --only-show-errors
          echo "uploaded s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${stamp}.sql.gz"

      - name: Prove the object is really there, and is really a backup
        # THE STEP THAT MAKES THE GREEN TICK MEAN SOMETHING. Everything above can succeed against
        # a bucket that silently dropped the write (a policy change, a wrong prefix, an SSE-KMS
        # key the media user cannot use) — `aws s3 cp` reports what it SENT, not what S3 holds
        # afterwards. This asks S3 a second, separate question and re-asserts the size, so "the
        # backup exists" is measured rather than assumed.
        #
        # ─── list-objects-v2 AND NOT head-object, AND THE REASON IS THE CREDENTIAL ───────────
        # `head-object` is the obvious call and needs `s3:GetObject` ON THE KEY. There is no
        # HEAD-only permission in S3 — granting the HEAD grants the GET — so a head-object proof
        # step would force "can read every database dump" onto this job's key. `list-objects-v2`
        # needs `s3:ListBucket` instead, which `aws_iam_user_policy.backup_writer` grants under a
        # `StringLike s3:prefix = backups/documentation-portal/*` condition: this job can learn the
        # NAME and SIZE of the dumps it wrote and can read the bytes of none of them, its own
        # included.
        #
        # It is not a weaker check. Size is the entire thing the assert ever used, and S3 LIST has
        # been strongly read-after-write consistent since 2020 — an object PUT a second ago is in
        # the listing, so no retry loop is needed here and none should be added.
        #
        # `--prefix` IS THE WHOLE KEY, not the directory, so at most one object can come back; the
        # `?Key==` filter then makes a prefix collision impossible rather than unlikely.
        # `Contents` is ABSENT (not empty) when nothing matches, so the query answers the literal
        # string `None` and the digits check below is what turns "the object is not there" into a
        # red run with a sentence on it, instead of a bare "integer expression expected".
        #
        # ─── THE PRINTED RESTORE COMMAND (added 2026-10-17) ───────────────────────────────────
        # The dump opens with `CREATE SCHEMA public`, which every new database already has, so a
        # plain restore under ON_ERROR_STOP stops there. Dropping that one line lets the whole dump
        # run as one transaction with no error (tested 2026-10-17 on PostgreSQL 17.11: 66 tables,
        # 60 migrations). TARGET_DSN must be a new, empty PostgreSQL 17+ database, never
        # production; against a non-empty one it fails and, being one transaction, changes nothing.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          key="${BACKUP_PREFIX}/${stamp}.sql.gz"
          size="$(aws s3api list-objects-v2 \
            --bucket "${BACKUP_BUCKET}" \
            --prefix "${key}" \
            --query "Contents[?Key=='${key}'].Size | [0]" \
            --output text)"
          echo "S3 reports size=${size} for s3://${BACKUP_BUCKET}/${key}"
          case "${size}" in
            ''|*[!0-9]*)
              echo "::error::S3 does not hold an object at ${key} (list returned '${size}'). The upload reported success, so this is a bucket-policy or prefix problem, not a network one."
              exit 1
              ;;
          esac
          if [ "${size}" -lt 102400 ]; then
            echo "::error::the object at ${key} is only ${size} bytes. A dump that small is an empty database, not a backup."
            exit 1
          fi
          echo "backup verified: s3://${BACKUP_BUCKET}/${key} (${size} bytes)"
          {
            echo "### Database backup"
            echo ""
            echo "\`s3://${BACKUP_BUCKET}/${key}\` — ${size} bytes"
            echo ""
            echo "Restore into a new, empty PostgreSQL 17+ database (never production):"
            echo ""
            echo "\`\`\`"
            echo "aws s3 cp s3://${BACKUP_BUCKET}/${key} - | gunzip | sed '/^CREATE SCHEMA public;\$/d' | psql \"\$TARGET_DSN\" -v ON_ERROR_STOP=1 -1"
            echo "\`\`\`"
            echo ""
            echo "Reading it back needs operator credentials, not this workflow's — the key it runs under can write to \`backups/\` and list it, and nothing else."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this week's copy for a year
        # Restore drill gap 4 (2026-10-18). The first successful run of each ISO week uploads the same
        # file a second time, under weekly/, which the bucket keeps for 365 days (`keep-weekly-dumps`
        # in infra/terraform/main.tf) instead of 30. "First run of the week" rather than "Sunday's
        # run", so a skipped or failed night never costs a week. Same key, same prefix, no new grant:
        # listing says whether this week is already held, so a re-run adds nothing.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          week="$(TZ=Asia/Kolkata date +%G-W%V)"
          wprefix="${BACKUP_PREFIX}/weekly/${week}_"
          held="$(aws s3api list-objects-v2 --bucket "${BACKUP_BUCKET}" --prefix "${wprefix}" \
            --query 'length(Contents || `[]`)' --output text)"
          if [ "${held}" != "0" ]; then
            echo "week ${week} is already held under ${wprefix}"
            exit 0
          fi
          wkey="${wprefix}${stamp}.sql.gz"
          aws s3 cp "backup-${stamp}.sql.gz" "s3://${BACKUP_BUCKET}/${wkey}" --only-show-errors
          size="$(aws s3api list-objects-v2 --bucket "${BACKUP_BUCKET}" --prefix "${wkey}" \
            --query "Contents[?Key=='${wkey}'].Size | [0]" --output text)"
          case "${size}" in
            ''|*[!0-9]*)
              echo "::error::S3 does not list the weekly copy ${wkey} after the upload (it answered '${size}')."
              exit 1
              ;;
          esac
          if [ "${size}" -lt 102400 ]; then
            echo "::error::the weekly copy ${wkey} is ${size} bytes, below the 100 KB floor."
            exit 1
          fi
          echo "weekly copy: s3://${BACKUP_BUCKET}/${wkey} (${size} bytes)"
          {
            echo ""
            echo "Weekly copy, kept for a year: \`s3://${BACKUP_BUCKET}/${wkey}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  freshness:
    # Restore drill gap 6 (2026-10-18). Runs on its own schedule and fails when the newest nightly
    # dump is more than 26 hours old, or the newest weekly copy more than 8 days old. A late or
    # skipped night then shows as a red run, and GitHub e-mails whoever last changed the schedule.
    # Same writer key: listing gives the name and the time, never the bytes.
    name: Newest dump is fresh
    if: github.event.schedule == '53 9 * * *' || inputs.task == 'freshness-check'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    env:
      AWS_DEFAULT_REGION: ap-south-1
      BACKUP_BUCKET: fieldrepo-media-626159998512
      BACKUP_PREFIX: backups/documentation-portal

    steps:
      - name: Check the newest nightly and weekly dumps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          # Prints "<key> <LastModified>" for the newest object under the prefix, or "None".
          newest() {
            aws s3api list-objects-v2 --bucket "${BACKUP_BUCKET}" --prefix "$1" \
              --query 'sort_by(Contents || `[]`, &LastModified)[-1].[Key, LastModified]' --output text
          }
          read -r nkey nwhen <<< "$(newest "${BACKUP_PREFIX}/20")"
          if [ "${nkey}" = "None" ] || [ -z "${nwhen:-}" ]; then
            echo "::error::no nightly dump under ${BACKUP_PREFIX}/. Treat the database as having NO backup."
            exit 1
          fi
          nage=$(( (now - $(date -u -d "${nwhen}" +%s)) / 3600 ))
          echo "newest nightly: ${nkey}, ${nage} h old"
          read -r wkey wwhen <<< "$(newest "${BACKUP_PREFIX}/weekly/")"
          wage=""
          if [ "${wkey}" = "None" ] || [ -z "${wwhen:-}" ]; then
            echo "::warning::no weekly copy yet. The next nightly run writes one."
          else
            wage=$(( (now - $(date -u -d "${wwhen}" +%s)) / 3600 ))
            echo "newest weekly: ${wkey}, ${wage} h old"
          fi
          {
            echo "### Backup freshness"
            echo ""
            echo "Nightly: \`${nkey}\`, ${nage} h old"
            [ -n "${wage}" ] && echo "" && echo "Weekly: \`${wkey}\`, ${wage} h old"
            true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${nage}" -gt 26 ]; then
            echo "::error::the newest nightly dump is ${nage} hours old (limit 26). Last night's run did not land: check this workflow's scheduled runs and run it by hand."
            exit 1
          fi
          if [ -n "${wage}" ] && [ "${wage}" -gt 192 ]; then
            echo "::error::the newest weekly copy is ${wage} hours old (limit 8 days)."
            exit 1
          fi
