name: Android build

on:
  workflow_run:
    workflows: ["Deploy frontend to Vercel"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Compile Kotlin (debug)
        id: compile
        run: ./gradlew :app:compileDebugKotlin --console=plain --stacktrace

      - name: The other portal, for the shared-file parity tests
        working-directory: .
        env:
          PEER: cxacraftecosystem-ui/designer-portal
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref=main
          if [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads "https://github.com/$PEER.git" "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          dest="$(dirname "$GITHUB_WORKSPACE")/${PEER#*/}"
          rm -rf "$dest"
          git clone --quiet --depth 1 --branch "$ref" "https://github.com/$PEER.git" "$dest"
          { echo "CROSS_PORTAL_PEER_REPO=$dest"; echo "SIBLING_REPO=$dest"; echo "DESIGNER_PORTAL_DIR=$dest"; } >> "$GITHUB_ENV"
          echo "Shared files are compared with $PEER@$ref ($(git -C "$dest" rev-parse --short HEAD))."

      - name: Unit tests
        id: tests
        run: |
          set -euo pipefail
          if [ -d app/src/test ] && [ -n "$(find app/src/test -name '*.kt' -o -name '*.java' 2>/dev/null | head -1)" ]; then
            echo "Unit-test sources found — running them for real."
          else
            echo "::warning::No app/src/test sources exist; :app:testDebugUnitTest is a placeholder (NO-SOURCE) and asserts nothing."
          fi
          ./gradlew :app:testDebugUnitTest             :core-imaging:test :core-vector:test :core-pipeline:test :core-export:test             --console=plain

      - name: Android Lint (debug)
        id: lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble the debug APK
        id: assemble
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Name the debug APK by the convention (NAMING 2.1)
        working-directory: ${{ github.workspace }}
        run: |
          version="$(sed -n 's/^val appVersionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/FieldRepository_Android-App_Debug-Build_v${version}.apk"

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/FieldRepository_Android-App_Debug-Build_v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-results
          path: |
            android/app/build/reports/tests/
            android/core-*/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise
        if: ${{ always() }}
        run: |
          {
            echo "### Android build"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| compileDebugKotlin | ${{ steps.compile.outcome }} |"
            echo "| testDebugUnitTest + core-*:test | ${{ steps.tests.outcome }} |"
            echo "| lintDebug | ${{ steps.lint.outcome }} (errors fail the build) |"
            echo "| assembleDebug | ${{ steps.assemble.outcome }} |"
            echo "| APK | \`FieldRepository_Android-App_Debug-Build_v<version>.apk\` — debug-signed, NOT an OTA release |"
          } >> "$GITHUB_STEP_SUMMARY"
