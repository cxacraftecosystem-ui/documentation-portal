name: Android build

# Stage 3 of 3:  deploy-backend.yml → deploy-frontend.yml → [ THIS ]
#
# ─── WHY LAST, AND WHY IT STILL RUNS WHEN A DEPLOY FAILED ─────────────────────────────
# This stage builds and checks the APK; it does not deploy anything. (Shipping a build to
# devices is a separate, deliberate act: the in-app OTA updater compares versionCode against
# a release-signed APK uploaded by a master admin — see android/README.md. Nothing here can
# reach a phone.) So it is ordered last purely as a dependency courtesy: it is the cheapest
# stage and the least urgent, and putting it ahead of the deploys would delay them.
#
# But note there is deliberately NO `conclusion == 'success'` gate on the trigger, unlike
# deploy-frontend.yml. A build+test gate's inputs are the source tree, not the state of the
# servers: if the EC2 deploy fails, "does the Android app still compile?" is a question you
# want answered *more* urgently, not less. Suppressing it would hide a Kotlin compile break
# behind an unrelated infrastructure failure and you would not find it until the next push.
# (deploy-frontend.yml's gate job always runs for the same reason — it keeps this workflow
# reachable even when it decides not to publish.)
#
# Pull requests also build directly, without waiting on the chain: nothing is deployed from
# a PR, so there is nothing to order against, and a contributor should get the compile
# result on the PR itself rather than after their merge lands on main.
#
# No repository secrets are required by this workflow.

on:
  workflow_run:
    workflows: ["Deploy frontend to Vercel"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by the commit under test so a re-push supersedes an in-flight build. Safe to
  # cancel here (unlike the deploy stages) — nothing is mutated outside the runner.
  group: android-build-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # On a workflow_run trigger the default ref is the tip of main, which may have
          # moved past the commit that was deployed. Build the commit that went out.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # The JDK that RUNS Gradle, not the bytecode level. 25 is the current Temurin LTS; Gradle
          # 9.8 runs on 17-27 and AGP 9.4 needs at least 17. The output is unchanged by it: every
          # module still compiles Java 17 bytecode (`compileOptions` in android/app/build.gradle.kts,
          # which AGP's built-in Kotlin follows; `jvmTarget` + `java {}` in the four core modules),
          # because 17 is the newest level Android documents. Not 27, the newest GA: Kotlin 2.4
          # documents Java only up to 26, and 26 is already end-of-life — move to 27 when a stable
          # Kotlin documents it.
          # publish-android.yml pins the same value, so a release is built on the JDK these
          # checks ran on.
          java-version: "25"
          # Caches ~/.gradle/caches and the wrapper distribution (Gradle 9.8.1, ~145 MB),
          # keyed on the gradle files. Without it every run re-downloads the whole
          # AndroidX/Compose dependency graph, which dominates the wall-clock time.
          cache: gradle

      - name: Make the Gradle wrapper executable
        # The wrapper is committed with mode 100644 (it was added from Windows), so the
        # runner cannot exec it as-is. Cheaper than rewriting the file mode in git.
        run: chmod +x gradlew

      - name: Ensure the required Android SDK packages are installed
        # The runner image ships an Android SDK, but which platform/build-tools versions are
        # preinstalled drifts with the image. compileSdk/targetSdk are 37, which is the
        # `android-37.0` platform package (API 37's packages carry the minor in their name), and
        # build-tools 37.0.0 is the newest (AGP 9.4 needs at least 36.0.0), so install them
        # explicitly rather than betting on the image. Both are no-ops when already present.
        # Must move with android/app/build.gradle.kts, and publish-android.yml installs the same.
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # android/local.properties is gitignored, so it does not exist here. Two consequences,
      # both intended:
      #   • sdk.dir falls back to $ANDROID_HOME, which the runner sets.
      #   • buildConfigField DEFAULT_API_BASE_URL falls back to the CloudFront production
      #     URL hard-coded in build.gradle.kts — i.e. the CI APK points at production, not
      #     at anyone's laptop. Do not "helpfully" write a local.properties here.

      - name: Compile Kotlin (debug)
        id: compile
        # Run before assembleDebug even though assemble depends on it: a compile break is
        # by far the most common failure and this surfaces it in ~1 min instead of ~4.
        run: ./gradlew :app:compileDebugKotlin --console=plain --stacktrace

      - name: Unit tests
        id: tests
        # HONEST STATUS: `app/src/test/` holds real suites (their counts are generated into
        # docs/REPO_FACTS.md — this comment used to restate them and they went stale), so this
        # step runs them for real and a red tick here is a real failure. `src/androidTest/`
        # still does not exist, so nothing instrumented runs — see the note at the foot of
        # this step.
        #
        # AND THE VENDORED TRACE ENGINE'S OWN SUITES, since 2026-10-09. The four core modules
        # are plain Kotlin/JVM with their own `test` tasks, including :core-pipeline's
        # ParityTest — the one check that the handset's engine draws what the browser's does —
        # and until then CI never ran them. They are here because that date moved their
        # compiler (Kotlin 2.0.21 -> 2.4.21) and their JSON library (kotlinx-serialization
        # 1.7.3 -> 1.11.0) at once, and "the app compiled" says nothing about either.
        #
        # THIS COMMENT USED TO SAY THE OPPOSITE, and the shape of that is worth keeping: it
        # read "android/app/src contains only `main/` … so it passes without asserting
        # anything", which was measured, was true, and then quietly stopped being true when
        # the first suites landed. Nothing here failed — the step had been written to detect
        # the change rather than to assume it, which is why the RUN below needed no edit and
        # only the prose did. That is the argument for the `if` under it: a step that decides
        # at run time which case it is in survives the day the tree moves, and a comment that
        # states the case as a fact does not. Rewritten rather than deleted so the next
        # person can see that the branch has now taken both paths in anger.
        run: |
          set -euo pipefail
          if [ -d app/src/test ] && [ -n "$(find app/src/test -name '*.kt' -o -name '*.java' 2>/dev/null | head -1)" ]; then
            echo "Unit-test sources found — running them for real."
          else
            echo "::warning::No app/src/test sources exist; :app:testDebugUnitTest is a placeholder (NO-SOURCE) and asserts nothing."
          fi
          ./gradlew :app:testDebugUnitTest             :core-imaging:test :core-vector:test :core-pipeline:test :core-export:test             --console=plain
          # Instrumented tests (src/androidTest) are NOT run: there are none, and they would
          # need an emulator on the runner. The emulator lives in its own workflow,
          # android-emulator.yml, run by hand — do not bolt one onto this job.

      - name: Android Lint (debug)
        # Non-blocking ON PURPOSE, and this is a measured decision, not a guess: running
        # `./gradlew :app:lintDebug` on this tree today gives "Lint found 1 errors, 44
        # warnings" and aborts — the error is
        #   AndroidManifest.xml:6  PermissionImpliesUnsupportedChromeOsHardware
        #   (uses-permission CAMERA with no matching <uses-feature required="false">)
        # which is a pre-existing manifest nit, unrelated to any change being tested. A
        # hard gate would therefore fail 100% of runs from day one and train everyone to
        # ignore red. The report is uploaded on every run instead. Fix that manifest entry
        # (or commit a lint-baseline.xml), then delete continue-on-error below and this
        # becomes a real gate — the fix is one <uses-feature> line, but AndroidManifest.xml
        # belongs to the Android workstream, not to this CI change.
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --console=plain

      - name: Flag lint failures without failing the build
        if: ${{ steps.lint.outcome == 'failure' }}
        run: echo "::warning::Android Lint reported problems — see the android-lint-report artifact. Not failing the build (see the comment in this workflow)."

      - name: Assemble the debug APK
        id: assemble
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # DEBUG-SIGNED build. It is a compile artifact for testers to sideload, NOT a
          # release: the in-app OTA updater only accepts APKs signed with the release key,
          # and Android refuses to install an APK whose signature differs from the one
          # already on the device. Cutting a real release is still the manual, key-holding
          # process in android/README.md.
          name: app-debug-${{ github.event.workflow_run.head_sha || github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-results
          path: |
            android/app/build/reports/tests/
            android/core-*/build/reports/tests/
          # `warn`, not `error`: a run that failed before the tests leaves no report, and the
          # missing artifact must not replace the real error.
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise
        if: ${{ always() }}
        run: |
          {
            echo "### Android build"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| compileDebugKotlin | ${{ steps.compile.outcome }} |"
            echo "| testDebugUnitTest + core-*:test | ${{ steps.tests.outcome }} |"
            echo "| lintDebug | ${{ steps.lint.outcome }} (advisory, does not fail the build) |"
            echo "| assembleDebug | ${{ steps.assemble.outcome }} |"
            echo "| APK | \`app-debug.apk\` — debug-signed, NOT an OTA release |"
          } >> "$GITHUB_STEP_SUMMARY"
