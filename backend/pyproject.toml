[project]
name = "field-repository-backend"
version = "0.0.3"
description = "API-first FastAPI backend for field documentation and repository workflows."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "PyJWT>=2.15.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "reportlab>=5.1.0",
    "uharfbuzz>=0.57.0",
    "prisma==0.15.0",
    "boto3>=1.43.123",
    "python-multipart>=0.0.33",
    "email-validator>=2.3.0",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "XlsxWriter>=3.3.1",
    "anthropic>=2.3.0",
    "anyascii>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "pypdf>=6.21.4",
]
ai = [
    "pillow>=13.0.0",
    "vtracer>=0.6.15",
]
ai-local = [
    "pillow>=13.0.0",
    "rembg>=2.0.86",
    "onnxruntime>=1.31.1",
]
cache = [
    "redis>=8.1.0",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["prisma*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.pytest.ini_options]
testpaths = ["tests"]
